<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>导航管理后台</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#15171a;color:#f0f2f5;font-size:14px}
  button{font:inherit}
  /* 加载骨架：init() 期间挡下闪屏 */
  .boot{position:fixed;inset:0;background:#15171a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#8b929a;font-size:14px;z-index:100}
  .boot .dot{width:8px;height:8px;border-radius:50%;background:#18a058;animation:pulse 1s ease-in-out infinite}
  .boot .dot.d2{animation-delay:.2s}
  .boot .dot.d3{animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  /* 深色滚动条美化 */
  *::-webkit-scrollbar{width:8px;height:8px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:#2b3036;border-radius:4px}
  *::-webkit-scrollbar-thumb:hover{background:#3a4048}
  *{scrollbar-width:thin;scrollbar-color:#2b3036 transparent}
  .auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .auth .card{width:min(380px,94vw);background:#1d2024;border:1px solid #2b3036;border-radius:16px;padding:26px}
  .auth h1{margin:0 0 4px;font-size:20px}
  .auth p{margin:0 0 20px;color:#8b929a;font-size:13px}
  .field{margin-bottom:14px}
  label{display:block;font-size:12px;color:#8b929a;margin-bottom:6px}
  input[type=text],input[type=number],input[type=week],textarea,select{
    width:100%;background:#15171a;color:#f0f2f5;border:1px solid #2b3036;border-radius:10px;padding:9px 11px;outline:0}
  input:focus,textarea:focus,select:focus{border-color:#18a058}
  textarea{resize:vertical;min-height:64px}
  .btn{background:#18a058;color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
  .btn.ghost{background:#2b3036}
  .btn.danger{background:#b03030}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .spacer{flex:1}
  .err{color:#ff8080;font-size:12px;min-height:16px;margin:8px 0}

  .app{display:flex;min-height:100vh}
  aside{width:210px;flex:0 0 210px;background:#1d2024;border-right:1px solid #2b3036;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
  aside .brand{font-weight:700;font-size:16px;margin-bottom:16px}
  aside a{display:block;padding:10px 12px;border-radius:10px;color:#c3c9d0;text-decoration:none;cursor:pointer;margin-bottom:4px}
  aside a.active{background:#223028;color:#18a058}
  aside .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  main{flex:1;padding:24px 28px;min-width:0}
  h2{margin:0 0 16px;font-size:18px}
  .panel{background:#1d2024;border:1px solid #2b3036;border-radius:14px;padding:18px;margin-bottom:18px}
  .group{border:1px solid #2b3036;border-radius:12px;padding:14px;margin-bottom:14px;background:#181b1f}
  .group-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .group-head input{flex:1}
  .item{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:#15171a;margin-bottom:8px}
  .item .ic{flex:0 0 34px;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden}
  .item .ic img{width:100%;height:100%;object-fit:cover}
  .item .meta{min-width:0;flex:1}
  .item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .u{font-size:12px;color:#8b929a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#223028;color:#7ee2a8;padding:10px 18px;border-radius:10px;border:1px solid #18a058;display:none;z-index:99}
  .toast.show{display:block}
  .stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .stat .b{background:#181b1f;border:1px solid #2b3036;border-radius:12px;padding:14px}
  .stat .n{font-size:26px;font-weight:700;color:#18a058}
  .stat .l{font-size:12px;color:#8b929a;margin-top:4px}
  .muted{color:#8b929a;font-size:12px}
  @media(max-width:760px){aside{position:fixed;left:-220px;z-index:20}main{padding:16px}}

  /* 通用 Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:200}
  .modal.open{display:flex}
  .mbox{width:min(680px,94vw);max-height:92vh;background:#1d2024;border:1px solid #2b3036;border-radius:14px;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden}
  .mbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #2b3036;font-weight:600}
  .mbar .x{background:none;border:0;color:#c3c9d0;cursor:pointer;font-size:20px;padding:2px 10px;border-radius:6px;line-height:1}
  .mbar .x:hover{background:#2b3036;color:#fff}
  .mbody{flex:1;overflow-y:auto;padding:18px}
  .mfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid #2b3036}

  /* 分组管理列表 */
  .gcard{background:#181b1f;border:1px solid #2b3036;border-radius:12px;margin-bottom:14px;overflow:hidden}
  .gcard-head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#1d2024}
  .gcard-title{font-weight:600;flex:1}
  .gcard-body{padding:14px 16px}
  .gcard .items{display:flex;flex-direction:column;gap:8px}
  .card-item{display:flex;align-items:center;gap:12px;background:#15171a;border:1px solid #2b3036;border-radius:10px;padding:10px 12px}
  .card-item .meta{flex:1;min-width:0}
  .card-item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-item .u{font-size:12px;color:#8b929a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Tab 切换 */
  .tabs{display:flex;gap:4px;background:#15171a;border:1px solid #2b3036;border-radius:10px;padding:3px;margin-bottom:14px}
  .tab{flex:1;padding:8px 12px;background:none;border:0;color:#c3c9d0;border-radius:8px;cursor:pointer;font-size:13px}
  .tab.active{background:#18a058;color:#fff}

  /* 效果预览 */
  .preview{background:#15171a;border:1px dashed #3a4048;border-radius:12px;padding:16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;min-height:70px}
  .preview .ic{flex:0 0 46px;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden;font-size:20px}
  .preview .ic img{width:100%;height:100%;object-fit:cover}
  .preview .p-title{font-size:15px;font-weight:600}
  .preview .p-desc{font-size:12px;color:#8b929a;margin-top:3px}

  /* 更多选项 */
  details.more{background:#15171a;border:1px solid #2b3036;border-radius:10px;padding:10px 12px;margin-top:10px}
  details.more summary{cursor:pointer;font-size:13px;color:#c3c9d0;outline:0}
  details.more[open] summary{margin-bottom:10px}

  /* 字数统计 */
  .counter{font-size:11px;color:#8b929a;float:right;margin-top:6px}

  /* 图标行 */
  .icon-row{display:flex;gap:8px;align-items:center}
  .icon-row input{flex:1}
</style>
</head>
<body>

<div class="boot" id="boot"><div style="display:flex;gap:6px"><div class="dot"></div><div class="dot d2"></div><div class="dot d3"></div></div><div>正在检查登录状态…</div></div>

<div class="auth" id="authView" style="display:none">
  <div class="card">
    <h1 id="authTitle">登录管理后台</h1>
    <p id="authSub">使用管理员账号登录</p>
    <div class="field"><label>用户名</label><input type="text" id="username" autocomplete="username"></div>
    <div class="field"><label>密码</label><input type="text" id="password" autocomplete="current-password"></div>
    <div class="err" id="authErr"></div>
    <button class="btn" id="authBtn" style="width:100%">登录</button>
    <p class="muted" style="margin-top:14px" id="authHint">还没有账号？</p>
  </div>
</div>

<div class="app" id="appView" style="display:none">
  <aside>
    <div class="brand">导航后台</div>
    <a data-tab="config" class="active">页面配置</a>
    <a data-tab="groups">分组与卡片</a>
    <a data-tab="backup">备份与导入</a>
    <a data-tab="stats">访问统计</a>
    <div class="foot">
      <div class="muted" id="whoami"></div>
      <button class="btn ghost sm" onclick="if (window.self !== window.top) { window.top.postMessage({type:'unav:close-modal'}, '*'); } else { location.href='/'; }">返回前台</button>
      <button class="btn ghost sm" id="logoutBtn">退出登录</button>
    </div>
  </aside>
  <main>
    <div id="tab-config"></div>
    <div id="tab-groups" style="display:none"></div>
    <div id="tab-backup" style="display:none"></div>
    <div id="tab-stats" style="display:none"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="mbox">
    <div class="mbar"><span id="mTitle">标题</span><button class="x" id="mClose">✕</button></div>
    <div class="mbody" id="mBody"></div>
    <div class="mfoot" id="mFoot"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const state = { user: null, config: {}, groups: [], mode: 'login' };

/* ---------- 工具 ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 2200); }
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body && !(body instanceof FormData) ? { 'content-type': 'application/json' } : undefined, body: body && !(body instanceof FormData) ? JSON.stringify(body) : (body || undefined) });
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
  return j;
}
const get = p => api('GET', p);
const post = (p, b) => api('POST', p, b);
const put = (p, b) => api('PUT', p, b);
const patch = (p, b) => api('PATCH', p, b);
const del = p => api('DELETE', p);
const letter = t => (String(t || '?').trim()[0] || '?').toUpperCase();

/* ---------- 登录 / 注册 ---------- */
async function bindAuth() {
  $('#authBtn').onclick = async () => {
    const username = $('#username').value.trim();
    const password = $('#password').value;
    $('#authErr').textContent = '';
    try {
      const r = state.mode === 'login' ? await post('/api/admin/login', { username, password }) : await post('/api/admin/register', { username, password });
      state.user = r;
      $('#authView').style.display = 'none';
      $('#appView').style.display = 'flex';
      await loadAll();
    } catch (e) { $('#authErr').textContent = e.message; }
  };
  $('#authHint').onclick = () => {
    state.mode = state.mode === 'login' ? 'register' : 'login';
    $('#authTitle').textContent = state.mode === 'login' ? '登录管理后台' : '创建管理员账号';
    $('#authSub').textContent = state.mode === 'login' ? '使用管理员账号登录' : '数据库为空时可直接创建第一个账号';
    $('#authHint').textContent = state.mode === 'login' ? '还没有账号？' : '已有账号？';
    $('#password').setAttribute('autocomplete', state.mode === 'login' ? 'current-password' : 'new-password');
  };
}

/* ---------- 数据加载 ---------- */
async function loadAll() {
  const [cfg, grps, st] = await Promise.all([get('/api/admin/config'), get('/api/admin/groups'), get('/api/admin/stats')]);
  state.config = cfg.config;
  state.groups = grps.groups;
  state.stats = st;
  $('#whoami').textContent = (st.session ? st.session.username + '（' + (st.session.role === 'owner' ? '管理员' : '编辑') + '）' : '');
  render();
}

/* ---------- 渲染 ---------- */
function render() {
  renderConfig();
  renderGroups();
  renderBackup();
  renderStats();
}

function renderConfig() {
  const c = state.config;
  const eng = c.search_engines || [];
  $('#tab-config').innerHTML = `
    <h2>页面配置</h2>
    <div class="panel">
      <div class="field"><label>首页标题</label><input type="text" id="c_logo"></div>
      <div class="row">
        <div class="field" style="flex:1"><label>深色 / 浅色主题</label><select id="c_theme"><option value="dark">深色</option><option value="light">浅色</option></select></div>
        <div class="field" style="flex:1"><label>壁纸地址（留空用纯色背景）</label><input type="text" id="c_bg"></div>
        <div class="field" style="flex:0 0 180px"><label>上传图片作壁纸</label><button class="btn ghost sm" id="c_upload">选择图片</button><input type="file" id="c_file" accept="image/*" style="display:none"></div>
      </div>
      <div class="row">
        <div class="field" style="flex:1"><label>壁纸模糊 ${c.background_blur ?? 10}px</label><input type="number" id="c_blur" min="0" max="40"></div>
        <div class="field" style="flex:1"><label>遮罩不透明度 ${(c.background_mask ?? .2)}</label><input type="number" id="c_mask" min="0" max="1" step="0.05"></div>
        <div class="field" style="flex:1"><label>顶部留白 ${c.margin_top ?? 6}vh</label><input type="number" id="c_mt" min="0" max="60"></div>
        <div class="field" style="flex:1"><label>卡片样式</label><select id="c_style"><option value="info">横排信息卡</option><option value="icon">小图标</option></select></div>
      </div>
      <div class="row">
        <div class="field" style="flex:1"><label>页脚文字</label><input type="text" id="c_footer"></div>
        <label class="row" style="margin:0;gap:6px"><input type="checkbox" id="c_show" style="width:auto"> 显示搜索框</label>
      </div>
      <div class="err" id="cfgErr"></div>
      <button class="btn" id="cfgSave">保存配置</button>
    </div>
    <div class="panel">
      <div class="group-head"><strong>搜索引擎</strong><button class="btn ghost sm spacer" id="engAdd">＋ 添加</button></div>
      <div id="engList"></div>
    </div>`;
  $('#c_logo').value = c.logo_text || '';
  $('#c_theme').value = c.theme || 'dark';
  $('#c_bg').value = c.background_image || '';
  $('#c_blur').value = c.background_blur ?? 10;
  $('#c_mask').value = c.background_mask ?? .2;
  $('#c_mt').value = c.margin_top ?? 6;
  $('#c_style').value = c.icon_style || 'info';
  $('#c_footer').value = c.footer || '';
  $('#c_show').checked = c.search_box_show !== 0;
  renderEngines();

  $('#c_upload').onclick = () => $('#c_file').click();
  $('#c_file').onchange = uploadBg;
  $('#c_save')?.remove();
  $('#cfgSave').onclick = saveConfig;
  $('#engAdd').onclick = () => { state.config.search_engines.push({ name: '', url: 'https://www.google.com/search?q=%s' }); renderEngines(); };
}

function renderEngines() {
  const box = $('#engList'); if (!box) return;
  box.innerHTML = '';
  (state.config.search_engines || []).forEach((e, i) => {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<input type="text" class="e_name" value="${esc(e.name)}" placeholder="名称">
      <input type="text" class="e_url" value="${esc(e.url)}" placeholder="https://…?q=%s">
      <button class="btn danger sm e_del">删除</button>`;
    row.querySelector('.e_del').onclick = () => { state.config.search_engines.splice(i, 1); renderEngines(); };
    row.querySelector('.e_name').onchange = ev => { state.config.search_engines[i].name = ev.target.value; };
    row.querySelector('.e_url').onchange = ev => { state.config.search_engines[i].url = ev.target.value; };
    box.appendChild(row);
  });
}

async function uploadBg(ev) {
  const f = ev.target.files[0];
  if (!f) return;
  const fd = new FormData(); fd.append('file', f);
  try {
    toast('上传中…');
    const r = await post('/api/admin/upload', fd);
    state.config.background_image = r.icon_url;
    $('#c_bg').value = r.icon_url;
    toast('已上传，记得点保存');
  } catch (e) { toast('上传失败：' + e.message); }
}

async function saveConfig() {
  const body = {
    logo_text: $('#c_logo').value,
    theme: $('#c_theme').value,
    background_image: $('#c_bg').value,
    background_blur: Number($('#c_blur').value || 10),
    background_mask: Number($('#c_mask').value || 0),
    margin_top: Number($('#c_mt').value || 6),
    icon_style: $('#c_style').value,
    footer: $('#c_footer').value,
    search_box_show: $('#c_show').checked ? 1 : 0,
    search_engines: (state.config.search_engines || []).filter(e => e.name && e.url),
  };
  try { $('#cfgErr').textContent = ''; await put('/api/admin/config', body); state.config = body; toast('配置已保存');
    setTimeout(() => {
      if (window.self !== window.top) { window.top.postMessage({type:'unav:refresh'}, '*'); }
      else { location.reload(); }
    }, 600);
  }
  catch (e) { $('#cfgErr').textContent = e.message; }
}

function renderGroups() {
  const box = $('#tab-groups');
  box.innerHTML = `<h2>分组与卡片</h2>
    <div class="row" style="margin-bottom:14px">
      <button class="btn" id="gAdd">＋ 添加分组</button>
      <span class="muted">点「编辑」改名称/图标/样式，卡片支持拖拽排序</span>
    </div>
    <div id="gList"></div>`;
  $('#gAdd').onclick = () => editGroup(null);
  const list = $('#gList');
  state.groups.forEach(g => list.appendChild(groupEl(g)));
  if (!state.groups.length) list.innerHTML = '<div class="muted">还没有分组，先添加一个</div>';
}

function groupEl(g) {
  const d = document.createElement('div');
  d.className = 'gcard';
  d.draggable = true;
  d.dataset.gid = g.id;
  d.innerHTML = `
    <div class="gcard-head">
      <span style="font-size:18px">📁</span>
      <div class="gcard-title">${esc(g.title)} <span class="muted" style="font-weight:400">(${g.icon_count || 0} 张卡片)</span></div>
      <button class="btn ghost sm" onclick="editGroup(${g.id})">✏ 编辑</button>
      <button class="btn danger sm" onclick="delGroup(${g.id})">🗑 删除</button>
    </div>
    <div class="gcard-body">
      <div class="row" style="margin-bottom:12px">
        <button class="btn ghost sm" onclick="iconEdit(${g.id}, null)">＋ 添加卡片</button>
        <button class="btn ghost sm" onclick="moveGroup(${g.id}, -1)" ${g.sort === Math.min(...state.groups.map(x=>x.sort)) ? 'disabled' : ''}>↑ 上移分组</button>
        <button class="btn ghost sm" onclick="moveGroup(${g.id}, 1)" ${g.sort === Math.max(...state.groups.map(x=>x.sort)) ? 'disabled' : ''}>↓ 下移分组</button>
      </div>
      <div class="items" id="items_${g.id}"></div>`;
  bindDrag(d, 'group', g.id);
  const list = d.querySelector(`#items_${g.id}`);
  (g.items || []).forEach(it => list.appendChild(itemEl(g, it)));
  return d;
}

function itemEl(g, it) {
  const d = document.createElement('div');
  d.className = 'card-item';
  d.draggable = true;
  d.dataset.iid = it.id;
  d.innerHTML = `
    <div class="ic" style="background:${esc(it.background_color || '#2a2a2a')}">${(it.icon_type==='data'||it.icon_type==='r2')&&it.icon_url?`<img src="${esc(it.icon_url)}">`:esc(letter(it.title))}</div>
    <div class="meta"><div class="t">${esc(it.title)}</div><div class="u">${esc(it.url || '（无网址）')}</div></div>
    <button class="btn ghost sm" onclick="iconEdit(${g.id}, ${it.id})">✏</button>
    <button class="btn ghost sm" onclick="moveIcon(${g.id}, ${it.id}, -1)">↑</button>
    <button class="btn ghost sm" onclick="moveIcon(${g.id}, ${it.id}, 1)">↓</button>
    <button class="btn danger sm" onclick="delIcon(${g.id}, ${it.id})">🗑</button>`;
  bindDrag(d, 'icon', it.id, g.id);
  return d;
}

/* 分组 / 卡片：拖拽排序 */
let dragSrc = null;
function bindDrag(el, kind, id, gid) {
  el.addEventListener('dragstart', e => {
    dragSrc = { kind, id, gid };
    el.style.opacity = '.4';
  });
  el.addEventListener('dragend', () => { el.style.opacity = '1'; dragSrc = null; });
  el.addEventListener('dragover', e => { e.preventDefault(); el.style.borderTop = kind === 'group' ? '2px solid #18a058' : '2px solid #18a058'; });
  el.addEventListener('dragleave', () => { el.style.borderTop = ''; });
  el.addEventListener('drop', async e => {
    e.preventDefault(); el.style.borderTop = '';
    if (!dragSrc || dragSrc.kind !== kind) return;
    if (kind === 'icon' && dragSrc.gid !== gid) return;
    if (dragSrc.id === id) return;
    if (kind === 'group') await swapGroupSort(id);
    else await swapIconSort(gid, id);
    await loadAll();
  });
}
async function swapGroupSort(targetId) {
  const src = state.groups.find(g => g.id === dragSrc.id);
  const dst = state.groups.find(g => g.id === targetId);
  if (!src || !dst) return;
  await patch('/api/admin/groups/' + src.id, { sort: dst.sort });
  await patch('/api/admin/groups/' + dst.id, { sort: src.sort });
}
async function swapIconSort(gid, targetId) {
  const g = state.groups.find(x => x.id === gid);
  const src = (g.items || []).find(x => x.id === dragSrc.id);
  const dst = (g.items || []).find(x => x.id === targetId);
  if (!src || !dst) return;
  await patch('/api/admin/icons/' + src.id, { sort: dst.sort });
  await patch('/api/admin/icons/' + dst.id, { sort: src.sort });
}

async function editGroup(id) {
  const g = id ? state.groups.find(x => x.id === id) : null;
  const isAdd = !g;
  const data = g || { title:'', description:'', card_style:'info', sort: Math.max(0, ...state.groups.map(x=>x.sort)) + 100, public_hide:0 };
  openModal(isAdd ? '添加分组' : '编辑分组', `
    <div class="field"><label>分组名称 *</label><input id="f_title" value="${esc(data.title)}" maxlength="30" placeholder="例：AI 与工具"></div>
    <div class="field"><label>描述（显示在标题旁）</label><input id="f_desc" value="${esc(data.description)}" maxlength="60"></div>
    <div class="field"><label>卡片样式</label>
      <select id="f_style">
        <option value="info" ${data.card_style==='info'?'selected':''}>横排信息卡（默认）</option>
        <option value="grid" ${data.card_style==='grid'?'selected':''}>网格样式</option>
        <option value="hide" ${data.card_style==='hide'?'selected':''}>前台隐藏此分组</option>
      </select>
    </div>
    <div class="field"><label>排序（数字越小越靠前）</label><input type="number" id="f_sort" value="${data.sort}"></div>
  `, `
    <button class="btn ghost" onclick="closeModal()">取消</button>
    <button class="btn" onclick="saveGroup(${id || 'null'})">保存</button>
  `);
  $('#f_title').focus();
}

async function saveGroup(id) {
  const body = {
    title: $('#f_title').value.trim(),
    description: $('#f_desc').value.trim(),
    card_style: $('#f_style').value,
    sort: Number($('#f_sort').value || 0),
  };
  if (!body.title) return toast('分组名称不能为空');
  if (id) await patch('/api/admin/groups/' + id, body);
  else await post('/api/admin/groups', body);
  closeModal();
  await loadAll();
  toast('已保存');
}

async function delGroup(id) {
  if (!confirm('删除该分组及其全部卡片？此操作不可撤销。')) return;
  await del('/api/admin/groups/' + id);
  await loadAll();
  toast('已删除');
}

async function moveGroup(id, dir) {
  const idx = state.groups.findIndex(g => g.id === id);
  const other = state.groups[idx + dir];
  if (!other) return;
  await patch('/api/admin/groups/' + id, { sort: other.sort });
  await patch('/api/admin/groups/' + other.id, { sort: state.groups[idx].sort });
  await loadAll();
  toast(dir > 0 ? '已下移' : '已上移');
}

async function iconEdit(gid, id) {
  const g = state.groups.find(x => x.id === gid);
  const it = id ? (g.items || []).find(x => x.id === id) : null;
  const isAdd = !it;
  const data = it || { title:'', url:'', lan_url:'', description:'', icon_type:'color', icon_url:'', background_color:'#2a2a2a', open_method:2, sort:0 };
  openModal(isAdd ? '添加卡片' : '编辑卡片', `
    <div class="preview" id="preview">
      <div class="ic" id="pv_ic" style="background:${esc(data.background_color)}">${(data.icon_type==='data'||data.icon_type==='r2')&&data.icon_url?`<img src="${esc(data.icon_url)}">`:esc(letter(data.title))}</div>
      <div><div class="p-title" id="pv_title">${esc(data.title || '卡片标题')}</div><div class="p-desc" id="pv_desc">${esc(data.description || '描述信息')}</div></div>
    </div>
    <div class="tabs" id="tabIcons">
      <button class="tab ${data.icon_type==='color'?'active':''}" data-type="color">文字</button>
      <button class="tab ${data.icon_type==='data'||data.icon_type==='r2'?'active':''}" data-type="data">图片</button>
      <button class="tab ${data.icon_type==='iconify'?'active':''}" data-type="iconify">在线图标</button>
    </div>
    <div id="iconFields"></div>
    <div class="field"><label>标题 *</label><input id="f_title" value="${esc(data.title)}" maxlength="20" placeholder="例：GitHub"></div>
    <div class="field"><label>描述信息</label><input id="f_desc" value="${esc(data.description)}" maxlength="100" placeholder="可选"></div>
    <div class="field"><label>默认地址 *</label><input id="f_url" value="${esc(data.url)}" placeholder="https://"></div>
    <div class="field"><label>内网地址（可选）</label><input id="f_lan" value="${esc(data.lan_url)}" placeholder="http://192.168.x.x"></div>
    <div class="field"><label>打开方式</label>
      <select id="f_open">
        <option value="1" ${data.open_method===1?'selected':''}>当前页打开</option>
        <option value="2" ${data.open_method===2?'selected':''}>新标签打开</option>
        <option value="3" ${data.open_method===3?'selected':''}>弹窗打开</option>
      </select>
    </div>
    <details class="more">
      <summary>更多选项（背景色、排序）</summary>
      <div class="field"><label>图标背景色</label><input type="color" id="f_color" value="${esc(data.background_color)}"></div>
      <div class="field"><label>排序（数字越小越靠前）</label><input type="number" id="f_sort" value="${data.sort}"></div>
    </details>
  `, `
    <button class="btn ghost" onclick="closeModal()">取消</button>
    <button class="btn" onclick="saveIcon(${gid}, ${id || 'null'})">保存</button>
  `);
  document.querySelectorAll('#tabIcons .tab').forEach(t => t.onclick = () => switchIconTab(t.dataset.type, data));
  switchIconTab(document.querySelector('#tabIcons .tab.active').dataset.type, data);
  ['f_title','f_desc','f_color'].forEach(fid => {
    const el = $('#' + fid);
    if (el) el.oninput = updatePreview;
  });
}

function switchIconTab(type, data) {
  document.querySelectorAll('#tabIcons .tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
  const f = $('#iconFields');
  if (type === 'color') {
    f.innerHTML = `<div class="field"><label>使用标题首字作为图标</label><div class="muted">无需填写，保存时自动从标题取首字</div></div>`;
  } else if (type === 'data') {
    f.innerHTML = `<div class="field"><label>图像地址</label>
      <div class="icon-row">
        <input id="f_icon_url" value="${esc(data.icon_url || '')}" placeholder="粘贴图片 URL，或本地上传">
        <button class="btn ghost sm" onclick="document.getElementById('iconFile').click()">📁 本地上传</button>
      </div>
      <input type="file" id="iconFile" accept="image/*" style="display:none">
    </div>`;
    document.getElementById('iconFile').onchange = async ev => {
      const file = ev.target.files[0]; if (!file) return;
      const fd = new FormData(); fd.append('file', file);
      try { const r = await post('/api/admin/upload', fd); $('#f_icon_url').value = r.icon_url; updatePreview(); toast('上传成功'); }
      catch (e) { toast('上传失败：' + e.message); }
    };
    $('#f_icon_url').oninput = updatePreview;
  } else if (type === 'iconify') {
    f.innerHTML = `<div class="field"><label>在线图标（Iconify 名）</label><input id="f_icon_name" value="${esc(data.icon_name || '')}" placeholder="例：ri:home-fill / mdi:github"></div>
      <div class="muted">格式：前缀:图标名，如 ri:home-fill、mdi:github、fa:github。留空则用标题首字。</div>`;
  }
  updatePreview();
}

function updatePreview() {
  const title = $('#f_title')?.value || '';
  const desc = $('#f_desc')?.value || '';
  const color = $('#f_color')?.value || '#2a2a2a';
  const type = document.querySelector('#tabIcons .tab.active').dataset.type;
  const iconUrl = $('#f_icon_url')?.value || '';
  const ic = $('#pv_ic');
  if (!ic) return;
  ic.style.background = color;
  ic.innerHTML = (type === 'data' && iconUrl) ? `<img src="${esc(iconUrl)}">` : esc((title || '?').charAt(0).toUpperCase());
  $('#pv_title').textContent = title || '卡片标题';
  $('#pv_desc').textContent = desc || '描述信息';
}

async function saveIcon(gid, id) {
  const body = {
    title: $('#f_title').value.trim(),
    description: $('#f_desc').value.trim(),
    url: $('#f_url').value.trim(),
    lan_url: $('#f_lan').value.trim(),
    open_method: Number($('#f_open').value),
    group_id: gid,
    sort: Number($('#f_sort')?.value || 0),
  };
  if (!body.title) return toast('标题不能为空');
  if (!body.url) return toast('默认地址不能为空');
  body.background_color = $('#f_color')?.value || '#2a2a2a';
  const type = document.querySelector('#tabIcons .tab.active').dataset.type;
  body.icon_type = type;
  if (type === 'data') body.icon_url = $('#f_icon_url').value;
  if (type === 'iconify') body.icon_name = $('#f_icon_name')?.value || '';
  if (id) await patch('/api/admin/icons/' + id, body);
  else await post('/api/admin/icons', body);
  closeModal();
  await loadAll();
  toast('已保存');
}

async function delIcon(gid, id) {
  if (!confirm('删除此卡片？')) return;
  await del('/api/admin/icons/' + id);
  await loadAll();
  toast('已删除');
}

async function moveIcon(gid, id, dir) {
  const g = state.groups.find(x => x.id === gid);
  const items = g.items || [];
  const idx = items.findIndex(it => it.id === id);
  const other = items[idx + dir];
  if (!other) return;
  await patch('/api/admin/icons/' + id, { sort: other.sort });
  await patch('/api/admin/icons/' + other.id, { sort: items[idx].sort });
  await loadAll();
  toast(dir > 0 ? '已下移' : '已上移');
}

function openModal(title, bodyHtml, footHtml) {
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = bodyHtml;
  $('#mFoot').innerHTML = footHtml || '';
  $('#modal').classList.add('open');
}
function closeModal() {
  $('#modal').classList.remove('open');
  $('#mBody').innerHTML = '';
  $('#mFoot').innerHTML = '';
}

function renderBackup() {
  $('#tab-backup').innerHTML = `
    <h2>备份与导入</h2>
    <div class="panel">
      <div class="row">
        <button class="btn" id="exp">导出全部数据（JSON）</button>
        <button class="btn ghost" id="imp">导入 JSON</button>
        <input type="file" id="impFile" accept="application/json" style="display:none">
      </div>
      <div class="err" id="bkErr"></div>
      <div class="muted">数据全部存 D1 数据库；定期点「导出」把 JSON 保存到本地磁盘做备份，需要恢复时再「导入」回来。所有数据（配置 / 分组 / 卡片 / 图片）都在一个文件里。</div>
    </div>`;
  $('#exp').onclick = async () => { const j = await get('/api/admin/export'); const blob = new Blob([JSON.stringify(j, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'unav-backup-' + new Date().toISOString().slice(0,10) + '.json'; a.click(); toast('已导出'); };
  $('#imp').onclick = () => $('#impFile').click();
  $('#impFile').onchange = importFile;
}

async function importFile(ev) {
  const f = ev.target.files[0]; if (!f) return;
  if (!confirm('导入将覆盖当前全部分组、卡片和配置，继续？')) { ev.target.value = ''; return; }
  try {
    const obj = JSON.parse(await f.text());
    const r = await post('/api/admin/import', { ...obj, confirm: 'restore' });
    toast(`已导入 ${r.groups} 组 / ${r.icons} 张`);
    await loadAll();
  } catch (e) { toast('导入失败：' + e.message); }
  ev.target.value = '';
}

function renderStats() {
  const s = state.stats || {};
  $('#tab-stats').innerHTML = `
    <h2>访问统计 <span class="muted">（<button class="btn ghost sm" id="stR">刷新</button>）</span></h2>
    <div class="panel">
      <div class="stat">
        <div class="b"><div class="n">${s.total_visits ?? 0}</div><div class="l">累计访问</div></div>
        <div class="b"><div class="n">${s.visits_24h ?? 0}</div><div class="l">最近 24 小时</div></div>
        <div class="b"><div class="n">${s.groups ?? 0}</div><div class="l">分组</div></div>
        <div class="b"><div class="n">${s.icons ?? 0}</div><div class="l">卡片</div></div>
        <div class="b"><div class="n">${s.users ?? 0}</div><div class="l">账号</div></div>
        <div class="b"><div class="n">${s.config_keys ?? 0}</div><div class="l">配置项</div></div>
      </div>
      <div class="muted" style="margin-top:12px">访问计数来自访客打开首页时的 /api/public/panel 请求，只记 IP 哈希不记明文。</div>
    </div>`;
  $('#stR').onclick = async () => { state.stats = await get('/api/admin/stats'); renderStats(); };
}

/* ---------- 导航与启动 ---------- */
function bindNav() {
  $$('#appView aside a').forEach(a => a.onclick = () => {
    $$('#appView aside a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    ['config', 'groups', 'backup', 'stats'].forEach(t => $('#tab-' + t).style.display = t === a.dataset.tab ? '' : 'none');
    if (a.dataset.tab === 'groups') renderGroups();
    if (a.dataset.tab === 'backup') renderBackup();
    if (a.dataset.tab === 'stats') renderStats();
  });
  $('#logoutBtn').onclick = async () => { await post('/api/admin/logout', {}).catch(() => {}); location.reload(); };
  $('#mClose').onclick = closeModal;
  $('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
}

(async function init() {
  bindAuth(); bindNav();
  let me = null;
  try { me = await get('/api/admin/me'); } catch { me = null; }
  const boot = $('#boot');
  if (me && me.logged_in) {
    state.user = me;
    $('#authView').style.display = 'none';
    $('#appView').style.display = 'flex';
    boot.style.display = 'none';
    await loadAll();
  } else {
    $('#authView').style.display = 'flex';
    $('#appView').style.display = 'none';
    boot.style.display = 'none';
  }
})();
</script>
</body>
</html>
