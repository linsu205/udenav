<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>导航管理后台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232fbf6b'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='%23fff' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  /* 底色跟主题走，--sp-* 由 styles/theme.css 提供；括号里是深色兜底，防止加载瞬间闪白 */
  html{background:var(--sp-bg,#17191c)}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--sp-bg,#17191c);color:var(--sp-text,#f0f2f5);font-size:14px}
  /* loading 骨架 */
  #boot{position:fixed;inset:0;background:var(--sp-bg,#17191c);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--sp-dim,#8b929a);font-size:14px;z-index:100}
  #boot .dot{width:8px;height:8px;border-radius:50%;background:#18a058;animation:pulse 1s ease-in-out infinite}
  #boot .dot.d2{animation-delay:.2s}
  #boot .dot.d3{animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  /* 滚动条 */
  *::-webkit-scrollbar{width:8px;height:8px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:var(--sp-scrollbar,#2b3036);border-radius:4px}
  *::-webkit-scrollbar-thumb:hover{background:var(--sp-scrollbar-hover,#3a4048)}
  *{scrollbar-width:thin;scrollbar-color:var(--sp-scrollbar,#2b3036) transparent}
</style>
<script>
  /* 主题跟随访客页：默认深色，随后由公开配置或父页消息覆盖（在样式生效前执行，避免闪色） */
  (function () {
    var root = document.documentElement;
    function set(t) { root.classList.toggle('dark', t !== 'light'); }
    set('dark');
    fetch('/api/public/config')
      .then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (d) { set(d && d.config && d.config.theme || 'dark'); })
      .catch(function () {});
    window.addEventListener('message', function (e) {
      if (e && e.data && e.data.type === 'udenav:theme') set(e.data.theme);
    });
  })();
</script>
  <script type="module" crossorigin src="/assets/admin.cKjg28Xo.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/admin.CFgnp20t.css">
</head>
<body>
<div id="boot"><div style="display:flex;gap:6px"><div class="dot"></div><div class="dot d2"></div><div class="dot d3"></div></div><div>正在检查登录状态…</div></div>
<div id="app"></div>
</body>
</html>
