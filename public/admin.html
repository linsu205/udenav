<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#15171a;color:#f0f2f5;font-size:14px}
  /* loading 骨架 */
  #boot{position:fixed;inset:0;background:#15171a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#8b929a;font-size:14px;z-index:100}
  #boot .dot{width:8px;height:8px;border-radius:50%;background:#18a058;animation:pulse 1s ease-in-out infinite}

  #boot .dot.d3{animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

  *{scrollbar-width:thin;scrollbar-color:#2b3036 transparent}
</style>
