<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>udenav</title>
<link id="fav" rel="icon" type="image/svg+xml" data-def="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23409EFF'/><path d='M22 22 V36 Q22 46 32 46 Q42 46 42 36 V14' fill='none' stroke='%23FFFFFF' stroke-width='7' stroke-linecap='round'/><path d='M34 22 L42 12 L50 22' fill='none' stroke='%23FFFFFF' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23409EFF'/><path d='M22 22 V36 Q22 46 32 46 Q42 46 42 36 V14' fill='none' stroke='%23FFFFFF' stroke-width='7' stroke-linecap='round'/><path d='M34 22 L42 12 L50 22' fill='none' stroke='%23FFFFFF' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root{
    --card-bg:rgba(74,82,98,.52); --card-bg-hover:rgba(96,106,124,.66);
    --text:#f5f6f7; --text-dim:#a9afb6; --radius:16px; --accent:#18a058;
    --blur:blur(10px);
  }
  html[data-theme="light"]{
    --card-bg:rgba(255,255,255,.82); --card-bg-hover:rgba(255,255,255,.95);
    --text:#606266; --text-dim:#909399;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
  /* 滚动条美化：细、圆角、半透明 */
  *::-webkit-scrollbar{width:8px;height:8px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:rgba(128,128,128,.35);border-radius:4px}
  *::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.55)}
  *{scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.35) transparent}
  .bg{position:fixed;inset:0;z-index:-2;background-size:cover;background-repeat:no-repeat;background-position:center;filter:var(--blur);-webkit-filter:var(--blur)}
  /* 整页背景模糊改为直接作用在背景图本身（.bg 的 filter），静态计算、不随滚动每帧重算，避免卡顿。
     原 .bg-blur 满屏 backdrop-filter 在视差渐变层背后，每帧都要重模糊整个视口，是滚动卡顿主因，已移除。 */
  .bg-mask{position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,var(--mask,.2))}
  html[data-theme="light"] .bg-mask{background:rgba(255,255,255,var(--mask,.2))}
  /* 背景视差：滚动时背景以约 1/7 的速度反向移动，避免内容硬平移、背景钉死 */
  /* 背景渐变层：比视口上下各多留 20vh，滚动时以约 1/7 速度反向位移形成视差。
     独立成层（而不是画在 body 上），否则没配背景图时视差根本看不见。
     配了背景图时 .bg 会盖住这层，视差自然让位（背景图本身保持钉住，不会露边） */
  .bg-grad{position:fixed;inset:-20vh 0;z-index:-3;transform:translate3d(0,var(--py,0),0);will-change:transform;
    background:linear-gradient(155deg,#262c36 0%,#1c2027 42%,#272e38 100%)}
  html[data-theme="light"] .bg-grad{background:linear-gradient(160deg,#f4f7fa 0%,#eaeff3 55%,#f1f5f8 100%)}

  .wrap{max-width:1200px;margin:0 auto;padding:0 18px 90px}
  header{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding-top:var(--mt,6vh)}
  .logo{font-size:46px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 18px rgba(0,0,0,.45),0 0 44px rgba(0,0,0,.25)}
  html[data-theme="light"] .logo{text-shadow:0 2px 14px rgba(255,255,255,.85),0 0 36px rgba(255,255,255,.5)}
  .sep{width:2px;height:34px;border-radius:1px;background:var(--text);opacity:.32;flex:none}
  .clock{text-align:center;line-height:1.25}
  .clock .t{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 2px 18px rgba(0,0,0,.45),0 0 40px rgba(0,0,0,.22)}
  html[data-theme="light"] .clock .t{text-shadow:0 2px 14px rgba(255,255,255,.85),0 0 34px rgba(255,255,255,.5)}
  .clock .d{font-size:13px;color:rgba(255,255,255,.92);text-shadow:0 1px 4px rgba(0,0,0,.55),0 2px 14px rgba(0,0,0,.45)}
  html[data-theme="light"] .clock .d{color:var(--text-dim);text-shadow:0 1px 10px rgba(255,255,255,.7)}
  @media(max-width:620px){.sep{display:none}}

  .search{margin:26px auto 0;max-width:680px;display:flex;align-items:center;gap:8px;
    background:var(--card-bg);box-shadow:0 6px 20px rgba(0,0,0,.18);
    border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:8px 10px}
  .search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:15px}
  .search input::placeholder{color:var(--text-dim)}
  .eng{position:relative}
  .eng-btn{background:var(--card-bg-hover);border:0;border-radius:999px;padding:7px 14px;color:var(--text);font-size:13px;cursor:pointer}
  .eng-list{display:none;position:absolute;top:44px;right:0;z-index:20;background:var(--card-bg-hover);
    border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .eng-list.open{display:block}
  .eng-list button{display:block;width:100%;background:none;border:0;color:var(--text);padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;text-align:left}
  .eng-list button:hover{background:rgba(24,160,88,.22)}
  .icon-btn{background:var(--card-bg-hover);border:0;color:var(--text);border-radius:999px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center}

  .group{margin-top:38px}
  .group-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:0 4px}
  .group-head h2{margin:0;font-size:19px;font-weight:700}
  .group-head .desc{font-size:13px;color:var(--text-dim)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
  .card{position:relative;display:flex;align-items:center;gap:12px;background:var(--card-bg);border:1px solid rgba(255,255,255,.08);
    border-radius:var(--radius);height:70px;padding:11px 14px;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s;
    box-shadow:0 4px 16px rgba(0,0,0,.18);overflow:hidden}
  /* 卡片与图标卡片共用同一套 hover 动画：背景变实、抬升 3px、同一组阴影 */
  .card:hover,.mini:hover{transform:translateY(-3px);background:var(--card-bg-hover);
    box-shadow:0 14px 34px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.06),0 0 22px rgba(24,160,88,.16)}
  .card .ic{flex:0 0 46px;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;color:#fff;overflow:hidden}
  .card .ic img{width:100%;height:100%;object-fit:cover}
  .card .body{min-width:0}
  .card .title{font-size:var(--fs,15px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .dsc{font-size:12px;color:var(--text-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 内网角标：后台给这张卡配了内网地址时，前台一眼看出「内网地址已配置」 */
  .card .lan-tag,.mini .lan-tag{position:absolute;top:7px;right:8px;font-size:10px;font-weight:700;line-height:1;
    padding:3px 5px;border-radius:6px;background:rgba(24,160,88,.92);color:#fff;letter-spacing:.5px;
    box-shadow:0 2px 8px rgba(0,0,0,.28);z-index:2}
  .empty{color:var(--text-dim);font-size:14px;padding:24px 4px}
  /* ---------- 小图标模式（card_style=icon，参照 sun-panel「图标」） ---------- */
  .grid.icons{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px}
  .mini{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 8px;border-radius:14px;
    cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s}
  .mini .mic{width:70px;height:70px;border-radius:18px;background:#8a8e93;display:flex;align-items:center;justify-content:center;
    overflow:hidden;box-shadow:0 6px 10px rgba(0,0,0,.18),0 14px 26px rgba(0,0,0,.26)}
  /* 未设置背景色时：底板与卡片同款玻璃（同 --card-bg + 细边 + 轻阴影），不再用纯灰实色 */
  .mini .mic.plain{background:var(--card-bg);border:1px solid rgba(255,255,255,.08);
    box-shadow:0 4px 16px rgba(0,0,0,.18)}
  html[data-theme="light"] .mini .mic.plain{border-color:rgba(31,35,40,.10);box-shadow:0 4px 16px rgba(31,35,40,.14)}
  /* 图片图标内缩居中（约 68%），四周露出底板 */
  .mini .mic img{width:68%;height:68%;object-fit:contain;border-radius:9px}
  /* 无图标时：文字直接显示在底板上 */
  .mini .mic .mtext{max-width:92%;font-size:var(--fs,17px);font-weight:700;color:#fff;letter-spacing:.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.25)}
  /* 玻璃底板上，浅色主题改用深色字，避免白字看不见 */
  html[data-theme="light"] .mini .mic.plain .mtext{color:var(--text);text-shadow:none}
  .mini .mname{max-width:92px;font-size:var(--fs,14px);color:var(--text);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  footer{margin-top:46px;text-align:center;font-size:12px;color:var(--text-dim)}

  /* ---------- 入场与滚动动画 ---------- */
  @keyframes rise{
    from{opacity:0;transform:translate3d(0,26px,0)}
    to{opacity:1;transform:translate3d(0,0,0)}
  }
  @keyframes cardIn{
    from{opacity:0;transform:translate3d(0,18px,0) scale(.975)}
    to{opacity:1;transform:translate3d(0,0,0) scale(1)}
  }
  /* 首屏：header -> 搜索框 -> 卡片 依次浮起 */
  header{animation:rise .72s cubic-bezier(.22,.61,.36,1) both}
  .search{animation:rise .72s cubic-bezier(.22,.61,.36,1) .13s both}
  .group{opacity:0}
  .group.in{animation:rise .56s cubic-bezier(.22,.61,.36,1) var(--d,0s) both}
  .card,.mini{opacity:0}
  /* 用 backwards 而不是 both：both 会把末帧的 transform 永久钉住，导致 :hover 的 translateY 失效 */
  .card.in,.mini.in{opacity:1;animation:cardIn .56s cubic-bezier(.22,.61,.36,1) var(--d,0s) backwards}
  /* 偏好减少动效时不做动画 */
  @media(prefers-reduced-motion:reduce){
    header,.search{animation:none}
    .group,.card,.mini{opacity:1!important;animation:none!important;transition:none!important}
  }
  /* 右上角工具条：sun-panel 同款 NButtonGroup —— 半透明深灰底 #2a2a2a6b + 白色 SVG 图标。
     三个按钮依次是「内外网切换 / 主题切换 / 管理后台」，尺寸 40x40，拼成一个圆角整块 */
  .toolbar{position:fixed;right:18px;top:18px;z-index:30;display:flex;border-radius:12px;overflow:hidden;
    box-shadow:0 0 10px 2px rgba(0,0,0,.20)}
  .tb{width:40px;height:40px;padding:0;border:0;border-left:1px solid rgba(255,255,255,.14);
    background:#2a2a2a6b;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .2s,transform .15s}
  .tb:first-child{border-left:0}
  .tb svg{width:20px;height:20px;display:block;pointer-events:none}
  .tb:hover{background:#3a3a3ab3}
  .tb:active{transform:scale(.94)}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s}
  .modal.open{opacity:1;visibility:visible;pointer-events:auto}
  .modal .box{width:min(1240px,96vw);height:min(820px,90vh);background:var(--card-bg);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 24px 60px rgba(0,0,0,.55);transform:translateY(12px) scale(.985);
    transition:transform .28s cubic-bezier(.2,.9,.3,1)}
  html[data-theme="light"] .modal .box{border-color:rgba(31,35,40,.10);box-shadow:0 24px 60px rgba(31,35,40,.30)}
  .modal.open .box{transform:none}
  .modal .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
    border-bottom:1px solid rgba(128,128,128,.18);background:var(--card-bg);color:var(--text);font-size:13px}
  .modal .bar .close{background:none;border:0;color:var(--text-dim);cursor:pointer;font-size:18px;padding:4px 10px;border-radius:8px;
    transition:background .15s,color .15s}
  .modal .bar .close:hover{background:rgba(128,128,128,.18);color:var(--text)}
  .modal iframe{flex:1;border:0;background:var(--card-bg)}
</style>
<noscript><style>.group,.card{opacity:1!important}</style></noscript>
</head>
<body>
<div class="bg-grad" id="bgGrad"></div>
<div class="bg" id="bg"></div>
<div class="bg-mask"></div>

<div class="wrap">
  <header>
    <div class="logo" id="logo">udenav</div>
    <div class="sep"></div>
    <div class="clock"><div class="t" id="time">--:--:--</div><div class="d" id="date"></div></div>
  </header>

  <div class="search" id="searchBox">
    <div class="eng">
      <button class="eng-btn" id="engBtn">Google</button>
      <div class="eng-list" id="engList"></div>
    </div>
    <input id="q" placeholder="搜索网站，或输入关键词搜索">
    <button class="icon-btn" id="clearBtn" title="清空" aria-label="清空">✕</button>
  </div>

  <div id="groups"></div>
  <footer id="footer"></footer>
</div>

<div class="toolbar">
  <button class="tb" id="lanBtn" title="切换到公网模式" aria-label="内外网切换" aria-pressed="true">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 20v-3q0-.825.588-1.412T5 15h1v-2q0-.825.588-1.412T8 11h3V9h-1q-.825 0-1.412-.587T8 7V4q0-.825.588-1.412T10 2h4q.825 0 1.413.588T16 4v3q0 .825-.587 1.413T14 9h-1v2h3q.825 0 1.413.588T18 13v2h1q.825 0 1.413.588T21 17v3q0 .825-.587 1.413T19 22h-4q-.825 0-1.412-.587T13 20v-3q0-.825.588-1.412T15 15h1v-2H8v2h1q.825 0 1.413.588T11 17v3q0 .825-.587 1.413T9 22H5q-.825 0-1.412-.587T3 20Zm7-13h4V4h-4v3ZM5 20h4v-3H5v3Zm10 0h4v-3h-4v3Z"/></svg>
  </button>
  <button class="tb" id="themeBtn" title="切换主题" aria-label="切换主题">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8C13.02 2.96 12.56 3 12 3z"/></svg>
  </button>
  <button class="tb" id="adminBtn" title="管理后台" aria-label="管理后台">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3.2" y="3.2" width="7.4" height="7.4" rx="2.1"/><rect x="13.4" y="3.2" width="7.4" height="7.4" rx="2.1"/><rect x="3.2" y="13.4" width="7.4" height="7.4" rx="2.1"/><rect x="13.4" y="13.4" width="7.4" height="7.4" rx="2.1"/></svg>
  </button>
</div>

<div class="modal" id="modal">
  <div class="box">
    <div class="bar"><span id="modalTitle">管理后台</span><button class="close" id="modalClose" title="关闭">✕</button></div>
    <iframe id="modalFrame" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const state = { config: {}, groups: [], engine: null, engines: [], intranet: false };

/* ---------- 渲染 ---------- */
function applyConfig(c) {
  state.config = c;
  document.title = c.logo_text || 'udenav';
  $('#logo').textContent = c.logo_text || 'udenav';
  $('#fav').setAttribute('href', String(c.favicon||'').trim() || $('#fav').dataset.def);
  document.documentElement.dataset.theme = c.theme || 'dark';
  $('#themeBtn').innerHTML = svgOf(ICON[(c.theme || 'dark') === 'dark' ? 'moon' : 'sun']);
  const bg = c.background_image;
  if (bg) { $('#bg').style.backgroundImage = `url("${bg.replace(/"/g,'')}" )`; $('#bg').style.display = 'block'; }
  else {
    $('#bg').style.display = 'none';
    document.body.style.background = (c.theme||'dark')==='dark'
      ? 'linear-gradient(155deg,#262c36 0%,#1c2027 42%,#272e38 100%)'
      : 'linear-gradient(160deg,#f4f7fa 0%,#eaeff3 55%,#f1f5f8 100%)';
  }
  document.documentElement.style.setProperty('--blur', `blur(${c.background_blur ?? 10}px)`);
  document.documentElement.style.setProperty('--mask', c.background_mask ?? 0.2);
  document.documentElement.style.setProperty('--mt', `${c.margin_top ?? 6}vh`);
  $('#footer').textContent = c.footer || '';
  $('#searchBox').style.display = c.search_box_show ? 'flex' : 'none';
  state.engines = Array.isArray(c.search_engines) && c.search_engines.length ? c.search_engines : DEFAULT_ENGINES;
  if (!state.engine || !state.engines.some(e => e.name === state.engine.name)) state.engine = state.engines[0];
  renderEngines();
}

const DEFAULT_ENGINES = [
  { name: '百度', url: 'https://www.baidu.com/s?wd=%s' },
  { name: 'Bing', url: 'https://www.bing.com/search?q=%s' },
  { name: 'Google', url: 'https://www.google.com/search?q=%s' },
];

function renderEngines() {
  $('#engBtn').textContent = state.engine.name;
  $('#engList').innerHTML = '';
  state.engines.forEach((e, i) => {
    const b = document.createElement('button');
    b.textContent = e.name;
    b.onclick = () => { state.engine = e; renderEngines(); $('#engList').classList.remove('open'); };
    $('#engList').appendChild(b);
  });
}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function letter(t) { return (String(t || '?').trim()[0] || '?').toUpperCase(); }

/* ---------- 名称显示规则 ----------
   1) 最多显示 4 个字宽：中文/全角算 1 个字，英文字母数字算半个字
      （这样「哔哩哔哩」=4 个字宽，「GitHub」=3 个字宽，不会被砍成「GitH」）
   2) 超出 4 个字宽就截断，末尾加省略号
   3) 字号随字数递减：1 个字最大，4 个字最小 */
const NAME_UNITS_MAX = 4;
const WIDE_CHAR = /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF\u3000\u2026]/;
const unitOf = ch => WIDE_CHAR.test(ch) ? 1 : 0.5;
function nameUnits(s) { let u = 0; for (const ch of String(s ?? '')) u += unitOf(ch); return u; }
function clipName(s) {
  const str = String(s ?? '');
  if (nameUnits(str) <= NAME_UNITS_MAX) return str;
  let out = '', u = 0;
  for (const ch of str) {
    const w = unitOf(ch);
    if (u + w > NAME_UNITS_MAX - 1) break;   // 留 1 个字宽给省略号
    out += ch; u += w;
  }
  return out + '…';
}
/* 各处名称的字号档位：键=字宽档（向上取整），值=px */
const FS_TEXT = { 1: 32, 2: 26, 3: 20, 4: 15 };   // 底板上的大字（70px 底板内要放得下）
const FS_NAME = { 1: 22, 2: 18, 3: 15, 4: 13 };   // 底板下方的名称
const FS_CARD = { 1: 22, 2: 19, 3: 16, 4: 15 };   // 卡片标题
function fsOf(t, table) {
  const u = Math.max(1, Math.min(NAME_UNITS_MAX, Math.ceil(nameUnits(t))));
  return table[u];
}

/* 兜底：字宽算出来的字号仍可能放不下（如英文单词偏宽），
   渲染后量一次真实宽度，塞不下就按比例缩一次 */
const FS_FLOOR = { mtext: 11, mname: 10, title: 11 };
function fitNames(root) {
  (root || document).querySelectorAll('.mtext, .mname, .title').forEach(el => {
    if (!el.textContent) return;
    const key = el.classList.contains('title') ? 'title' : (el.classList.contains('mtext') ? 'mtext' : 'mname');
    const floor = FS_FLOOR[key] || 11;
    /* 可用宽度：mtext 跟着底板走（92%），mname/title 走自身 max-width */
    let limit;
    if (key === 'mtext') {
      const plate = el.parentElement;
      limit = plate ? plate.clientWidth * 0.92 : 0;
    } else {
      limit = el.clientWidth;
    }
    if (!limit) return;
    const w = el.scrollWidth;              // 当前字号下的文字实际宽度
    if (w <= limit + 0.5) return;
    const cur = parseFloat(getComputedStyle(el).fontSize);
    const next = Math.max(floor, cur * limit / w);
    el.style.fontSize = next.toFixed(1) + 'px';
  });
}

function iconHtml(item) {
  if (item.iconUrl) return `<img src="${esc(item.iconUrl)}" alt="" loading="lazy">`;
  return `<span>${esc(letter(item.title))}</span>`;
}

function renderGroups() {
  const box = $('#groups');
  const kw = $('#q').value.trim().toLowerCase();
  const filtered = state.groups.filter(g => {
    if (g.cardStyle === 'hide') return false;
    return g.items.filter(it => !kw || (it.title + ' ' + (it.description || '') + ' ' + (it.url || '')).toLowerCase().includes(kw));
  });
  box.innerHTML = '';
  if (!filtered.length) { box.innerHTML = '<div class="empty">没有匹配的卡片</div>'; return; }
  filtered.forEach(g => {
    const sec = document.createElement('section');
    sec.className = 'group';
    sec.innerHTML = `<div class="group-head"><h2>${esc(g.title)}</h2>${g.description ? `<span class="desc">${esc(g.description)}</span>` : ''}</div>`;
    const grid = document.createElement('div');
    grid.className = g.cardStyle === 'icon' ? 'grid icons' : 'grid';
    g.items.forEach(it => {
      if (g.cardStyle === 'icon') {
        /* 小图标模式（参照 sun-panel）：未设背景色用玻璃底板（同卡片），设了则用实色 */
        const plate = it.color ? ` style="background:${esc(it.color)}"` : '';
        const micCls = it.color ? 'mic' : 'mic plain';
        const short = clipName(it.title);
        const inner = it.iconUrl
          ? `<img src="${esc(it.iconUrl)}" alt="" loading="lazy">`
          : `<span class="mtext" style="--fs:${fsOf(short, FS_TEXT)}px">${esc(short)}</span>`;
        const c = document.createElement('div');
        c.className = 'mini';
        c.innerHTML = `${it.lanUrl ? '<span class="lan-tag">内</span>' : ''}<span class="${micCls}"${plate}>${inner}</span>`
          + `<span class="mname" style="--fs:${fsOf(short, FS_NAME)}px" title="${esc(it.title)}">${esc(short)}</span>`;
        c.onclick = () => openUrl(it);
        grid.appendChild(c);
        return;
      }
      const c = document.createElement('div');
      c.className = 'card';
      const short = clipName(it.title);
      c.innerHTML = `${it.lanUrl ? '<span class="lan-tag">内</span>' : ''}<div class="ic" style="background:${esc(it.color || '#2a2a2a')}">${iconHtml(it)}</div>`
        + `<div class="body"><div class="title" style="--fs:${fsOf(short, FS_CARD)}px" title="${esc(it.title)}">${esc(short)}</div>${it.description ? `<div class="dsc">${esc(it.description)}</div>` : ''}</div>`;
      c.onclick = () => openUrl(it);
      grid.appendChild(c);
    });
    sec.appendChild(grid);
    box.appendChild(sec);
  });
  /* 名称按实际渲染宽度再兜底缩一次（英文偏宽的情况） */
  fitNames(box);
}

/* 内外网互为兜底：开关选「内网」但这张卡没配内网地址 → 直接开外网地址；反之没配外网 → 开内网地址 */
function pickUrl(it) {
  const wan = String(it.url || '').trim();
  const lan = String(it.lanUrl || '').trim();
  return state.intranet ? (lan || wan) : (wan || lan);
}

function openUrl(it) {
  const url = pickUrl(it);
  if (!url) return;
  if (it.openMethod === 3) {
    $('#modalTitle').textContent = it.title || url;
    $('#modalFrame').src = url;
    $('#modal').classList.add('open');
  } else if (it.openMethod === 1) {
    location.href = url;
  } else {
    window.open(url, '_blank');
  }
}

/* ---------- 时钟 ---------- */
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
function tick() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  $('#time').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  $('#date').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${WEEK[d.getDay()]}`;
}

/* ---------- 内外网切换（sun-panel 同款：图标就是当前模式，点一下切到另一种） ----------
   lan 模式显示 lan-outline-rounded 图标，wan 模式显示 mdi:wan 图标；
   只决定点卡片时打开哪个地址，选择记在本机；某个地址没配就回退到另一个 */

const svgOf = p => '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' + p + '</svg>';
const ICON = {

  wan: '<path d="M12 2a8 8 0 0 0-8 8c0 4.03 3 7.42 7 7.93V19h-1a1 1 0 0 0-1 1H2v2h7a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1h7v-2h-7a1 1 0 0 0-1-1h-1v-1.07c4-.5 7-3.9 7-7.93a8 8 0 0 0-8-8m0 2s.74 1.28 1.26 3h-2.52C11.26 5.28 12 4 12 4m-2.23.43c-.27.5-.68 1.41-1.03 2.57H6.81C7.5 5.84 8.5 4.93 9.77 4.43m4.46.01c1.27.5 2.27 1.4 2.96 2.56h-1.93c-.35-1.16-.76-2.07-1.03-2.56M6.09 9h2.23c-.04.33-.07.66-.07 1c0 .34.03.67.07 1H6.09a5.551 5.551 0 0 1 0-2m4.23 0h3.36c.04.33.07.66.07 1c0 .34-.03.67-.07 1h-3.36c-.04-.33-.07-.66-.07-1c0-.34.03-.67.07-1m5.36 0h2.23a5.551 5.551 0 0 1 0 2h-2.23c.04-.33.07-.66.07-1c0-.34-.03-.67-.07-1m-8.87 4h1.93c.35 1.16.76 2.07 1.03 2.56c-1.27-.5-2.27-1.4-2.96-2.56m3.93 0h2.52c-.52 1.72-1.26 3-1.26 3s-.74-1.28-1.26-3m4.52 0h1.93c-.69 1.16-1.69 2.07-2.96 2.57c.27-.5.68-1.41 1.03-2.57Z"/>',
  moon: '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8C13.02 2.96 12.56 3 12 3z"/>',
  sun:  '<path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10m0-5a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1m0 18a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1M4.22 5.64a1 1 0 0 1 1.41 0l1.42 1.41a1 1 0 1 1-1.42 1.42L4.22 7.05a1 1 0 0 1 0-1.41m11.31 9.9a1 1 0 0 1 1.41 0l1.42 1.41a1 1 0 0 1-1.42 1.42l-1.41-1.42a1 1 0 0 1 0-1.41M3 12a1 1 0 0 1 1-1h2a1 1 0 0 1 0 2H4a1 1 0 0 1-1-1m16 0a1 1 0 0 1 1-1h2a1 1 0 0 1 0 2h-2a1 1 0 0 1-1-1M4.47 17.66a1 1 0 0 1 0 1.41L3.05 20.49a1 1 0 1 1-1.41-1.42l1.41-1.41a1 1 0 0 1 1.42 0m9.9-11.31a1 1 0 0 1 0-1.42l1.42-1.41a1 1 0 0 1 1.41 1.41l-1.41 1.42a1 1 0 0 1-1.42 0z"/>'
};
/* 默认「内网」：首次访问图标为 lan，点一下切到 wan 公网 */
state.intranet = localStorage.getItem(LAN_KEY) !== '0';
function applyLanMode() {
  const b = $('#lanBtn');
  b.innerHTML = svgOf(ICON[state.intranet ? 'lan' : 'wan']);
  b.setAttribute('aria-pressed', String(!!state.intranet));
  b.title = state.intranet ? '切换到公网模式' : '切换到内网模式';
}
$('#lanBtn').onclick = () => {
  state.intranet = !state.intranet;
  localStorage.setItem(LAN_KEY, state.intranet ? '1' : '0');
  applyLanMode();
};
applyLanMode();

/* ---------- 主题切换 ---------- */
$('#themeBtn').onclick = async () => {
  const cur = document.documentElement.dataset.theme;
  const next = cur === 'dark' ? 'light' : 'dark';
  applyConfig({ ...state.config, theme: next });
  pushTheme();   // 后台弹窗开着的话也一起跟着换
  await fetch('/api/admin/config', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ theme: next }) }).catch(() => {});
};

/* ---------- 管理后台弹窗（后台主题跟随访客页） ---------- */
function pushTheme() {
  const fr = $('#modalFrame');
  try {
    fr.contentWindow && fr.contentWindow.postMessage(
      { type: 'udenav:theme', theme: document.documentElement.dataset.theme || 'dark' }, '*');
  } catch (e) {}
}
$('#modalFrame').addEventListener('load', pushTheme);

/* 打开后台弹窗 */
function openAdmin() {
  $('#modalTitle').textContent = '管理后台';
  $('#modalFrame').src = '/admin';
  $('#modal').classList.add('open');
}

/* 关闭弹窗 */
function closeModal() {
  $('#modal').classList.remove('open');
  $('#modalFrame').src = '';
}

$('#adminBtn').onclick = openAdmin;

/* 后台保存后同步前台：重新拉一次公开数据并原地重渲染。
   不整页刷新 —— 不闪屏、不丢滚动位置、弹窗不用被迫关掉 */
function syncFromAdmin() {
  fetch('/api/public/panel', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if (!j || !Array.isArray(j.groups)) return;
      applyConfig(j.config || FALLBACK.config);
      state.groups = j.groups;
      renderGroups();
      /* 重新渲染出的 .group/.card 没有 .in（默认 opacity:0），必须重跑入场编排，否则内容不可见 */
      initMotion();
    })
    .catch(() => {});
}

window.addEventListener('message', e => {
  if (!e.data || typeof e.data.type !== 'string') return;
  if (e.data.type === 'udenav:close-modal') { closeModal(); syncFromAdmin(); }
  else if (e.data.type === 'udenav:reload-panel') syncFromAdmin();
  else if (e.data.type === 'udenav:refresh') location.reload();
});

/* ---------- 交互 ---------- */
$('#engBtn').onclick = e => { e.stopPropagation(); $('#engList').classList.toggle('open'); };
document.addEventListener('click', () => $('#engList').classList.remove('open'));
$('#q').addEventListener('input', renderGroups);
$('#clearBtn').onclick = () => { $('#q').value = ''; renderGroups(); };
$('#modalClose').onclick = closeModal;
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

$('#q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const kw = e.target.value.trim();
  if (!kw) return;
  const url = state.engine.url.replace('%s', encodeURIComponent(kw));
  window.open(url, '_blank');
});

/* ---------- 启动：优先读后端，读不到就用内置数据 ---------- */
const FALLBACK = {
  config: { logo_text: 'udenav', favicon: '', background_blur: 10, background_mask: 0.2, margin_top: 6, icon_style: 'info', search_box_show: 1, theme: 'dark', search_engines: DEFAULT_ENGINES },
  groups: [
    { id: 1, title: '常用', description: '每天要打开的', cardStyle: 'info', items: [
      { title: '百度', url: 'https://www.baidu.com', description: '中文搜索', color: '#2932e1', openMethod: 2 },
      { title: '哔哩哔哩', url: 'https://www.bilibili.com', description: '弹幕视频', color: '#fb7299', openMethod: 2 },
    ]},
    { id: 2, title: '工作', description: '办公与文档', cardStyle: 'info', items: [
      { title: 'QQ 邮箱', url: 'https://mail.qq.com', description: '收发邮件', color: '#12b7f5', openMethod: 2 },
    ]},
  ],
};

(async function init() {
  let data = FALLBACK;
  try {
    const r = await fetch('/api/public/panel', { cache: 'no-store' });
    if (r.ok) { const j = await r.json(); if (j && Array.isArray(j.groups)) data = j; }
  } catch { /* 离线打开时用内置数据 */ }
  applyConfig(data.config || FALLBACK.config);
  state.groups = data.groups || [];
  renderGroups();
  initMotion();
  tick();
  setInterval(tick, 1000);
  /* 兜底：动效编排异常时也不能让首屏内容一直不可见 */
  setTimeout(() => document.querySelectorAll('.group:not(.in), .card:not(.in), .mini:not(.in)').forEach(el => {
    if (el.getBoundingClientRect().top < innerHeight + 200) {
      el.style.setProperty('opacity', '1'); el.classList.add('in');
    }
  }), 2600);
})();

/* ---------- 入场动画 + 滚动视差 ----------
   必须在 renderGroups() 之后调用（卡片由 JS 渲染），
   因此用函数声明而非 IIFE：IIFE 的函数名在外部作用域不可见 */
function initMotion() {
  const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const els = () => [...document.querySelectorAll('.group:not(.in), .card:not(.in), .mini:not(.in)')];
  const show = el => { el.style.setProperty('opacity', '1'); el.classList.add('in'); };

  /* 视差：背景层随滚动缓慢反向位移。用 transform 走合成层，不触发重排。
     监听只注册一次——后台保存后 syncFromAdmin 会再次调用本函数补放入场动画，
     不能每次都叠加 scroll 监听 */
  if (!initMotion._parallaxBound) {
    initMotion._parallaxBound = true;
    const parallax = $('#bgGrad');
    if (parallax && !RM) {
      let raf = 0;
      const apply = () => { raf = 0; parallax.style.setProperty('--py', (-window.scrollY * 0.14).toFixed(2) + 'px'); };
      window.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(apply); }, { passive: true });
      apply();
    }
  }

  if (RM) { els().forEach(show); return; }   // 用户关掉动效时直接显示

  const inViewport = el => { const r = el.getBoundingClientRect(); return r.top < innerHeight + 120; };

  /* 首屏：按视口纵坐标顺序排队，依次浮起 */
  const first = els().filter(inViewport).sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
  first.forEach((el, i) => { el.style.setProperty('--d', (i * 10) + 'ms'); show(el); });

  /* 滚动进入视口的部分，滚到才播一次 */
  const io = new IntersectionObserver(entries => {
    entries.filter(e => e.isIntersecting).forEach(e => {
      const g = e.target;
      const cards = g.classList.contains('group') ? [...g.querySelectorAll('.card:not(.in), .mini:not(.in)')] : [g];
      cards.forEach((c, i) => { c.style.setProperty('--d', (i * 14) + 'ms'); show(c); });
      io.unobserve(g);
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
  els().filter(el => !inViewport(el)).forEach(el => io.observe(el));
}
</script>
