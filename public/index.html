<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UDeNav</title>
<link id="fav" rel="icon" type="image/svg+xml" data-def="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23409EFF'/><path d='M22 22 V36 Q22 46 32 46 Q42 46 42 36 V14' fill='none' stroke='%23FFFFFF' stroke-width='7' stroke-linecap='round'/><path d='M34 22 L42 12 L50 22' fill='none' stroke='%23FFFFFF' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23409EFF'/><path d='M22 22 V36 Q22 46 32 46 Q42 46 42 36 V14' fill='none' stroke='%23FFFFFF' stroke-width='7' stroke-linecap='round'/><path d='M34 22 L42 12 L50 22' fill='none' stroke='%23FFFFFF' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root{
    --card-bg:rgba(74,82,98,.52); --card-bg-hover:rgba(96,106,124,.66);
    --text:#f5f6f7; --text-dim:#a9afb6; --radius:16px; --accent:#18a058;
    --blur:blur(10px);
    /* 直接压在背景图上的文字（logo / 分隔线 / 时钟 / 分组标题 / 图标名）：
       两个主题都固定用白色，不跟随 --text。浅色主题里深灰字扣在背景图上经常看不清，
       而这些元素本身没有底色可依托，所以统一按深色主题那套走。
       （分组标题颜色同样是锁白的，只是投影半径单独收窄，见 .group-head h2） */
    --on-bg:#fff; --on-bg-dim:rgba(255,255,255,.92);
    /* 压在壁纸上的白字统一用这一条字影（分组标题 / 图标名 / 日期 / 页脚 / 空态）：
       1px 下偏移的柔影负责托出对比，2px 小半径只会擦着笔画外缘，
       不像 8px/20px 大柔影那样把字距填平糊成灰色长方块 —— 既压得住浅色壁纸，也不留灰底。
       （试过的 4 向 1px 实边轮廓会让笔画发毛，已弃用） */
    --on-bg-ts:0 1px 2px rgba(0,0,0,.55),0 0 1px rgba(0,0,0,.34);
    /* 滚动条：轨道宽 12px，滑块只占中间 4px（靠 4px 透明边框内缩），
       所以是「一根悬在页面边缘内侧的细圆条」，而不是贴着边的一条粗灰杠。
       默认很淡，鼠标进到页面里才变明显 —— 静止时几乎不抢背景的戏 */
    --sb-track:12px;
    --sb-thumb:rgba(255,255,255,.20);
    --sb-thumb-hover:rgba(255,255,255,.46);
  }
  html:hover{--sb-thumb:rgba(255,255,255,.34)}
  html[data-theme="light"]{
    --card-bg:rgba(255,255,255,.82); --card-bg-hover:rgba(255,255,255,.95);
    --text:#606266; --text-dim:#909399;
    /* 浅色主题背景偏亮，滑块改用浅黑，白条会看不见 */
    --sb-thumb:rgba(31,35,40,.16); --sb-thumb-hover:rgba(31,35,40,.34);
  }
  html[data-theme="light"]:hover{--sb-thumb:rgba(31,35,40,.24)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
  /* 唯一滚动容器：铺满视口、背景透明，滚动条就压在壁纸层上面 */
  .scroller{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
  /* 滚动条：sunpanel 那种「细圆胶囊」质感
     —— 轨道全透明；滑块圆头 (999px)、半透明，靠 4px 透明边框 + background-clip
        在 12px 宽的轨道里收成 4px 细条，距页面右边缘留出 4px 呼吸位；
     —— 页面静止时很淡，鼠标进入页面才加深（html:hover 改 --sb-thumb），
        滚起来不会突然多出一条深灰杠打断背景图 */
  *::-webkit-scrollbar{width:var(--sb-track);height:var(--sb-track)}
  *::-webkit-scrollbar-track{background:transparent;border:0}
  *::-webkit-scrollbar-thumb{background:var(--sb-thumb);background-clip:content-box;
    border:4px solid transparent;border-radius:999px;
    transition:background-color .25s ease}
  *::-webkit-scrollbar-thumb:hover{background:var(--sb-thumb-hover);background-clip:content-box}
  *::-webkit-scrollbar-corner{background:transparent}
  /* Firefox 兜底。注意必须用 @supports 限死在「不支持 ::-webkit-scrollbar」的浏览器里：
     Chrome 只要看到 scrollbar-width / scrollbar-color，就会切到系统滚动条实现，
     上面那套 ::-webkit-scrollbar 圆角细条会被整段忽略（宽度也变回系统的 10px） */
  @supports not selector(::-webkit-scrollbar){
    *{scrollbar-width:thin;scrollbar-color:var(--sb-thumb) transparent}
  }
  .bg{position:fixed;inset:0;z-index:-2;background-size:cover;background-repeat:no-repeat;background-position:center;filter:var(--blur);-webkit-filter:var(--blur)}
  /* 整页背景模糊改为直接作用在背景图本身（.bg 的 filter），静态计算、不随滚动每帧重算，避免卡顿。
     原 .bg-blur 满屏 backdrop-filter 在视差渐变层背后，每帧都要重模糊整个视口，是滚动卡顿主因，已移除。 */
  .bg-mask{position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,var(--mask,.2))}
  html[data-theme="light"] .bg-mask{background:rgba(255,255,255,var(--mask,.2))}
  /* 背景视差：滚动时背景以约 1/7 的速度反向移动，避免内容硬平移、背景钉死 */
  /* 背景渐变层：比视口上下各多留 20vh，滚动时以约 1/7 速度反向位移形成视差。
     独立成层（而不是画在 body 上），否则没配背景图时视差根本看不见。
     配了背景图时 .bg 会盖住这层，视差自然让位（背景图本身保持钉住，不会露边） */
  .bg-grad{position:fixed;inset:-20vh 0;z-index:-3;transform:translate3d(0,var(--py,0),0);will-change:transform;
    background:linear-gradient(155deg,#262c36 0%,#1c2027 42%,#272e38 100%)}
  html[data-theme="light"] .bg-grad{background:linear-gradient(160deg,#f4f7fa 0%,#eaeff3 55%,#f1f5f8 100%)}

  .wrap{max-width:var(--cmw,1200px);margin:0 auto;padding:0 18px 90px}
  /* 一律加 .wrap 前缀：后台的 Element Plus 弹窗会被 teleport 到 <body>，
     裸标签选择器会把访客页的 header/footer 样式打到 .el-dialog__header / __footer 上
     （表现为弹窗顶部多出一大块空白、标题被居中）。class 自己带前缀的规则没有这个问题。 */
  .wrap>header{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding-top:var(--mt,6vh)}
  .logo{font-size:60px;font-weight:800;letter-spacing:1px;color:var(--on-bg);
    text-shadow:0 2px 18px rgba(0,0,0,.45),0 0 44px rgba(0,0,0,.25)}
  .sep{width:2px;height:34px;border-radius:1px;background:var(--on-bg);opacity:.32;flex:none}
  .clock{text-align:center;line-height:1.25}
  .clock .t{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--on-bg);
    text-shadow:0 2px 18px rgba(0,0,0,.45),0 0 40px rgba(0,0,0,.22)}
  .clock .d{font-size:13px;color:var(--on-bg-dim);text-shadow:var(--on-bg-ts)}
  @media(max-width:620px){.sep{display:none}}
  /* 不显示时钟/日期时，把后面的分隔符也一起藏掉（否则会留下一个孤零零的竖线） */
  html.no-clock #clock, html.no-clock #sep{display:none!important}

  /* position+z-index 必须加：rise 动画末帧保留 transform，使 .search 成为独立层叠上下文，
     下拉列表的 z-index 被困在里面，#groups 的分组标题（普通流内容）会画在下拉之上，
     表现为「下拉里的引擎选项点不动」（点到标题上了）。提升为定位元素后整体盖过普通流 */
  .search{position:relative;z-index:5;margin:10px auto 0;max-width:680px;display:flex;align-items:center;gap:8px;
    background:var(--card-bg);box-shadow:0 6px 20px rgba(0,0,0,.18);
    border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:8px 10px}
  .search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:15px}
  .search input::placeholder{color:var(--text-dim)}
  .eng{position:relative}
  .eng-btn{background:var(--card-bg-hover);border:0;border-radius:999px;padding:7px 14px;color:var(--text);font-size:13px;cursor:pointer}
  .eng-list{display:none;position:absolute;top:44px;right:0;z-index:20;background:var(--card-bg-hover);
    border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .eng-list.open{display:block}
  .eng-list button{display:block;width:100%;background:none;border:0;color:var(--text);padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;text-align:left}
  .eng-list button:hover{background:rgba(24,160,88,.22)}
  .icon-btn{background:var(--card-bg-hover);border:0;color:var(--text);border-radius:999px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center}

  /* 注意：以下 .group / .card / .mini 规则必须限定在访客页 .wrap 内。
     后台是同一个文档里的 Vue 组件（#adminRoot 在 .modal 里），
     它的分组卡片也用了 .group 类，不限定作用域会被这里的 opacity:0 直接隐掉。 */
  /* 分组间距可由后台配置（--gmt，默认 22px，范围 10~38），作用于所有分组 */
  .wrap .group{margin-top:var(--gmt,22px)}
  /* 标题行按底对齐：＋ 要贴住标题的右下角，用 center 会让它浮在标题中线附近 */
  .group-head{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px;padding:0 4px}
  /* max-width + ellipsis：标题再长也不会撑到「＋」底下（之前文字压在按钮上是这个原因） */
  /* 分组标题：两个主题恒定白字（--on-bg 锁白，不跟主题反转）。
     字影用全局的 --on-bg-ts（1px 下偏移柔影 + 2px 小半径），字缘干净、不发毛、不成灰块 */
  .group-head h2{margin:0;font-size:19px;line-height:1.3;font-weight:700;color:var(--on-bg);
    text-shadow:var(--on-bg-ts);
    flex:0 1 auto;min-width:0;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 分组标题前的图标：inline 排在一行里（不用 flex，否则标题的 ellipsis 会失效），
     尺寸对齐 19px 字高；投影跟标题同一版（图片不认 text-shadow，只能用 filter） */
  .group-head h2 .g-ico{width:19px;height:19px;margin-right:8px;vertical-align:-3px;object-fit:contain;
    filter:drop-shadow(0 0 1px rgba(0,0,0,.5)) drop-shadow(0 1px 1px rgba(0,0,0,.42))}
  /* 分组标题右下角的「＋」：16×16 玻璃小方钮，align-self:flex-end 让它的底边和标题行底部齐平，
     视觉上就是叼在标题最后一个字右下角。材质与卡片一致（半透明 + 描边 + 模糊）。
     参照 sun-panel：平时完全隐藏，鼠标移到这一组（标题行或它的卡片）才浮现，
     不悬浮时标题区保持干净。选择器统一带 .group 前缀，保证「浮现 → 按钮自身 hover」
     的优先级是递增的，不会被浮现规则按下去 */
  .group .group-head .g-add{flex:none;align-self:flex-end;width:16px;height:16px;margin-left:-5px;margin-bottom:1px;padding:0;
    border-radius:5px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--on-bg);
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    opacity:0;transform:scale(.86);pointer-events:none;
    transition:opacity .16s,transform .16s,background .16s,border-color .16s}
  .group .group-head .g-add svg{width:10px;height:10px;fill:currentColor;display:block}
  /* 悬浮整组（标题行或卡片都算）时浮现 */
  .group:hover .group-head .g-add{opacity:.72;transform:none;pointer-events:auto}
  /* 键盘 Tab 到它时也要能看见（始终留在可聚焦序列里，所以不用 visibility:hidden） */
  .group .group-head .g-add:focus-visible{opacity:1;transform:none;pointer-events:auto;
    outline:2px solid rgba(255,255,255,.75);outline-offset:2px}
  /* 鼠标压到按钮上：完全不透明 + 提亮 + 放大 */
  .group:hover .group-head .g-add:hover{opacity:1;background:rgba(255,255,255,.26);
    border-color:rgba(255,255,255,.46);transform:scale(1.07)}
  .group:hover .group-head .g-add:active{transform:scale(.93)}
  /* 触屏没有 hover：一直显示，否则手机/平板上永远加不了卡片 */
  @media (hover:none){
    .group .group-head .g-add{opacity:.72;transform:none;pointer-events:auto}
  }
  /* 浅色主题不能让白底白边糊掉：改成白玻璃 + 深色加号 */
  html[data-theme="light"] .group .group-head .g-add{color:#3d444c;background:rgba(255,255,255,.62);
    border-color:rgba(31,35,40,.16);box-shadow:0 1px 4px rgba(31,35,40,.10)}
  html[data-theme="light"] .group:hover .group-head .g-add:hover{background:#fff;border-color:rgba(31,35,40,.3)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
  .card{position:relative;display:flex;align-items:center;gap:12px;background:var(--card-bg);border:1px solid rgba(255,255,255,.08);
    border-radius:var(--radius);height:70px;padding:11px 14px;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s;
    box-shadow:0 4px 16px rgba(0,0,0,.18);overflow:hidden}
  /* 卡片 hover：底色加深 + 抬升 + 阴影（玻璃卡材质，整卡动） */
  .card:hover{transform:translateY(-3px);background:var(--card-bg-hover);
    box-shadow:0 14px 34px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.06),0 0 22px rgba(24,160,88,.16)}
  .card .ic{flex:0 0 46px;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;color:#fff;overflow:hidden;line-height:1}
  /* CJK 字面在行盒里自带「下沉」（字体把降部空间留在基线下方），flex 居中 +
     line-height:1 后字面仍偏低。translateY 的具体值按实测墨迹中心闭环校准：
     canvas 字体度量显示 -4.5px 会把字面抬到图标框中心上方约 3px（偏上），
     改 -1.5px 后拉丁字母与 CJK 的墨迹中心都落在 ±0.5px 内。 */
  /* white-space:nowrap：3 字以上的图标文字缩字号后仍可能贴边，禁止折行兜底 */
  .card .ic span{transform:translateY(-1.5px);white-space:nowrap}
  .card .ic img{width:100%;height:100%;object-fit:cover}
  /* 未设置背景色 = 真的没有底色：图标直接浮在卡片上（不画玻璃方块）。
     卡片本身就是玻璃材质，底板上再铺一层同色玻璃只会多出一圈描边，看着像「没清干净」。
     小图标模式（.mic.plain）不同——它的底板落在壁纸上，所以那边保留玻璃底 */
  .card .ic.plain{background:transparent}
  /* 透明底板上白字会看不见（浅色主题的卡片接近白色），改深色字 */
  html[data-theme="light"] .card .ic.plain{color:var(--text)}
  .card .body{min-width:0}
  .card .title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .dsc{font-size:12px;color:var(--text-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 「内」角标已按用户要求取消：内外网切换由右上开关控制，卡片上不再挂角标 */
  .empty{color:var(--on-bg-dim);font-size:14px;padding:24px 4px;text-shadow:var(--on-bg-ts)}
  /* ---------- 小图标模式（card_style=icon，参照 sun-panel「图标」） ---------- */
  .grid.icons{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px}
  /* 图标模式：容器永远透明 —— 鼠标移上去也不能给它加背景或阴影。
     容器本身没有背景，给容器投影等于画出一个透明的圆角矩形轮廓，
     浅色主题下看着就是「一块白/灰底板」浮在图标后面（用户明确不要）。
     所以悬停反馈全部落在有实体的图标底板上：容器抬 3px，底板放大 + 加深阴影 */
  .mini{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 8px;border-radius:14px;
    cursor:pointer;background:transparent;
    transition:transform .18s}
  .mini:hover{transform:translateY(-3px)}
  .mini .mic{width:70px;height:70px;border-radius:18px;background:#8a8e93;display:flex;align-items:center;justify-content:center;
    overflow:hidden;box-shadow:0 6px 10px rgba(0,0,0,.18),0 14px 26px rgba(0,0,0,.26);
    transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .22s}
  /* 未设置背景色时：底板用玻璃质感（同 --card-bg + 细边 + 轻阴影） */
  .mini .mic.plain{background:var(--card-bg);border:1px solid rgba(255,255,255,.08);
    box-shadow:0 4px 16px rgba(0,0,0,.18)}
  html[data-theme="light"] .mini .mic.plain{border-color:rgba(31,35,40,.10);box-shadow:0 4px 16px rgba(31,35,40,.14)}
  /* 悬停：底板放大 + 阴影加深。必须写在 .plain / 浅色那几条之后 ——
     它们选择性相同或更高，写在前面会被盖掉（深色主题下曾是这个问题） */
  .mini:hover .mic,
  .mini:hover .mic.plain{transform:scale(1.08);
    box-shadow:0 10px 18px rgba(0,0,0,.26),0 20px 36px rgba(0,0,0,.34)}
  html[data-theme="light"] .mini:hover .mic,
  html[data-theme="light"] .mini:hover .mic.plain{box-shadow:0 8px 16px rgba(31,35,40,.18),0 18px 32px rgba(31,35,40,.22)}
  /* 图片图标内缩居中（约 68%），四周露出底板 */
  .mini .mic img{width:68%;height:68%;object-fit:contain;border-radius:9px}
  /* 无图标时：文字直接显示在底板上。
     限宽 76%：92% 时 4 个字的墨迹几乎顶到 70px 底板两边（只剩 ~5px），
     收到 76% 后左右各留 ~8px，字号由 fitNames 按这个宽度自动缩一档 */
  .mini .mic .mtext{max-width:76%;font-size:min(var(--fs,17px),18px);font-weight:700;color:#fff;letter-spacing:.5px;line-height:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.25)}
  /* 玻璃底板上，浅色主题改用深色字，避免白字看不见 */
  html[data-theme="light"] .mini .mic.plain .mtext{color:var(--text);text-shadow:none}
  /* 底板下方的名称：固定字号，超长只省略不缩放。
     字影回到分组标题同一版（--on-bg-ts）—— 既不是会让笔画发毛的 4 向轮廓，
     也不是 0 1px 8px / 0 2px 20px 的大柔影（那版会在 14px 字后糊出灰色长方块） */
  .mini .mname{max-width:92px;font-size:14px;color:var(--on-bg);text-align:center;
    text-shadow:var(--on-bg-ts);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wrap>footer{margin-top:46px;text-align:center;font-size:12px;color:var(--on-bg-dim);text-shadow:var(--on-bg-ts)}

  /* ---------- 悬停提示（替代浏览器原生 title） ----------
     深色主题：黑底白字；浅色主题：白底黑字。圆角 + 小箭头 + 淡入位移 */
  .tip{position:fixed;left:-9999px;top:0;z-index:2400;pointer-events:none;
    max-width:300px;padding:6px 10px;border-radius:8px;font-size:12.5px;line-height:1.55;
    white-space:pre-line;word-break:break-word;text-align:left;
    background:#17191d;color:#f5f6f7;border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 28px rgba(0,0,0,.46);opacity:0;transform:translateY(4px);
    transition:opacity .15s ease,transform .15s ease}
  .tip.on{opacity:1;transform:none}
  /* 箭头与被悬停元素中心对齐，颜色跟随气泡 */
  .tip::after{content:'';position:absolute;left:var(--ax,50%);bottom:-4.5px;width:8px;height:8px;
    transform:translateX(-50%) rotate(45deg);background:inherit;
    border-right:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14)}
  .tip.below::after{top:-4.5px;bottom:auto;border-right:0;border-bottom:0;
    border-left:1px solid rgba(255,255,255,.14);border-top:1px solid rgba(255,255,255,.14)}
  /* 右侧出泡（data-tip-pos="right"，组名描述用）：箭头在左缘指向元素 */
  .tip.right::after{left:-4.5px;right:auto;top:var(--ay,50%);bottom:auto;
    transform:translateY(-50%) rotate(45deg);
    border-right:0;border-bottom:0;
    border-left:1px solid rgba(255,255,255,.14);border-top:1px solid rgba(255,255,255,.14)}
  html[data-theme="light"] .tip{background:#fff;color:#20242a;border-color:rgba(31,35,40,.12);
    box-shadow:0 10px 26px rgba(31,35,40,.2)}
  html[data-theme="light"] .tip::after{border-color:rgba(31,35,40,.12)}

  /* ---------- 卡片右键菜单（sun-panel 同款） ---------- */
  /* display:none -> 显示时动画会重新起跑，所以用 animation 而不是 transition */
  @keyframes ctxIn{from{opacity:0;transform:translateY(-5px) scale(.965)}to{opacity:1;transform:none}}
  .ctx-menu{position:fixed;z-index:2100;min-width:196px;background:#2b2f36;border:1px solid rgba(255,255,255,.09);
    border-radius:12px;padding:6px;color:var(--text);box-shadow:0 18px 44px rgba(0,0,0,.5);font-size:12.5px;user-select:none;
    transform-origin:var(--ox,0) var(--oy,0);animation:ctxIn .14s cubic-bezier(.22,.61,.36,1) both}
  html[data-theme="light"] .ctx-menu{background:#fff;border-color:rgba(31,35,40,.12);box-shadow:0 18px 44px rgba(31,35,40,.22)}
  .ctx-menu .mi{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;
    transition:background .13s}
  .ctx-menu .mi:hover{background:rgba(255,255,255,.09)}
  html[data-theme="light"] .ctx-menu .mi:hover{background:rgba(31,35,40,.06)}
  .ctx-menu .mi svg{width:15px;height:15px;fill:currentColor;flex:none;opacity:.9}
  .ctx-menu .mi.danger{color:#ff7875}
  /* 快捷操作：5 个等宽方形按钮排一行（原来 3+2 两行、宽度不一，看着乱） */
  .ctx-menu .acts{display:flex;gap:6px;margin:6px 2px 4px}
  .ctx-menu .acts button{flex:1;height:32px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:transparent;
    color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
    transition:background .13s,border-color .13s,opacity .13s}
  .ctx-menu .acts button svg{width:16px;height:16px;fill:currentColor;opacity:.9}
  .ctx-menu .acts button:hover:not(:disabled){background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.22)}
  .ctx-menu .acts button:disabled{opacity:.28;cursor:not-allowed}
  html[data-theme="light"] .ctx-menu .acts button{border-color:rgba(31,35,40,.14)}
  html[data-theme="light"] .ctx-menu .acts button:hover:not(:disabled){background:rgba(31,35,40,.05);border-color:rgba(31,35,40,.24)}
  .ctx-menu .sep{height:1px;background:rgba(255,255,255,.09);margin:5px 4px}
  html[data-theme="light"] .ctx-menu .sep{background:rgba(31,35,40,.1)}
  /* 组件卡片的菜单只有「前移 / 后移 / 删除」三条，用不着那排等宽方块按钮
     （两个按钮 flex:1 会被拉成两条又宽又空的格子），统一成文字行更整齐 */
  .ctx-menu .mi.dis{opacity:.32;cursor:not-allowed}
  .ctx-menu .mi.dis:hover{background:transparent}

  /* ---------- 入场与滚动动画 ---------- */
  @keyframes rise{
    from{opacity:0;transform:translate3d(0,26px,0)}
    to{opacity:1;transform:translate3d(0,0,0)}
  }
  @keyframes cardIn{
    from{opacity:0;transform:translate3d(0,18px,0) scale(.975)}
    to{opacity:1;transform:translate3d(0,0,0) scale(1)}
  }
  /* 首屏：header -> 搜索框 -> 卡片 依次浮起 */
  .wrap>header{animation:rise .72s cubic-bezier(.22,.61,.36,1) both}
  .search{animation:rise .72s cubic-bezier(.22,.61,.36,1) .13s both}
  .wrap .group{opacity:0}
  .wrap .group.in{animation:rise .56s cubic-bezier(.22,.61,.36,1) var(--d,0s) both}
  .wrap .card,.wrap .mini{opacity:0}
  /* 用 backwards 而不是 both：both 会把末帧的 transform 永久钉住，导致 :hover 的 translateY 失效 */
  .wrap .card.in,.wrap .mini.in{opacity:1;animation:cardIn .56s cubic-bezier(.22,.61,.36,1) var(--d,0s) backwards}
  /* 偏好减少动效时不做动画 */
  @media(prefers-reduced-motion:reduce){
    .wrap>header,.search{animation:none}
    .wrap .group,.wrap .card,.wrap .mini{opacity:1!important;animation:none!important;transition:none!important}
    .toast{transition:none}
  }
  /* 右上角工具条：sun-panel 同款 NButtonGroup —— 半透明深灰底 #2a2a2a6b + 白色 SVG 图标。
     三个按钮依次是「内外网切换 / 主题切换 / 管理后台」，尺寸 40x40，拼成一个圆角整块 */
  .toolbar{position:fixed;right:18px;top:18px;z-index:30;display:flex;border-radius:12px;overflow:hidden;
    box-shadow:0 0 10px 2px rgba(0,0,0,.20)}
  .tb{width:40px;height:40px;padding:0;border:0;border-left:1px solid rgba(255,255,255,.14);
    background:#2a2a2a6b;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .2s,transform .15s}
  .tb:first-child{border-left:0}
  /* .tb 是 display:flex，会盖掉 UA 的 [hidden]{display:none}，轮播开关隐藏时要靠这条 */
  .tb[hidden]{display:none}
  .tb svg{width:20px;height:20px;display:block;pointer-events:none}
  .tb:hover{background:#3a3a3ab3}
  .tb:active{transform:scale(.94)}
  /* 返回顶部：滚过一屏后出现在右下角，和右上角工具条同一套视觉（半透明深灰 + 白色图标）。
     固定定位、不占文档流，所以滚动时不会跟着内容抖动；隐藏时用 visibility 一并挡掉点击 */
  .to-top{position:fixed;right:18px;bottom:22px;z-index:30;
    width:40px;height:40px;padding:0;border:0;border-radius:12px;
    background:#2a2a2a6b;color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 10px 2px rgba(0,0,0,.20);
    opacity:0;visibility:hidden;transform:translateY(10px) scale(.94);
    transition:opacity .22s,transform .22s cubic-bezier(.34,1.24,.5,1),visibility .22s,background .2s}
  .to-top.on{opacity:1;visibility:visible;transform:none}
  .to-top:hover{background:#3a3a3ab3}
  .to-top:active{transform:scale(.94)}
  /* 隐藏态带 visibility:hidden，本身就不在 Tab 序列里；显示后补一圈键盘焦点环 */
  .to-top:focus-visible{outline:2px solid rgba(255,255,255,.75);outline-offset:2px}
  .to-top svg{width:20px;height:20px;display:block;pointer-events:none}
  @media (max-width:640px){
    .to-top{right:14px;bottom:16px;width:38px;height:38px}
  }
  /* 顶部居中提示：切换内外网时短暂显示「当前处于哪个模式」，深灰胶囊 + 白色图标文字，深浅主题都清晰 */
  .toast{position:fixed;top:16px;left:50%;z-index:40;transform:translate(-50%,-18px);
    display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;
    background:rgba(34,38,44,.92);border:1px solid rgba(255,255,255,.12);color:#fff;
    font-size:13px;font-weight:600;letter-spacing:1px;white-space:nowrap;
    box-shadow:0 8px 22px rgba(0,0,0,.34);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .22s,transform .22s cubic-bezier(.34,1.24,.5,1),visibility .22s}
  .toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
  .toast .ti{display:flex;width:18px;height:18px}
  .toast .ti svg{width:18px;height:18px;display:block}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s}
  .modal.open{opacity:1;visibility:visible;pointer-events:auto}
  .modal .box{width:min(1240px,96vw);height:min(820px,90vh);background:var(--card-bg);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 24px 60px rgba(0,0,0,.55);transform:translateY(12px) scale(.985);
    transition:transform .28s cubic-bezier(.2,.9,.3,1)}
  html[data-theme="light"] .modal .box{border-color:rgba(31,35,40,.10);box-shadow:0 24px 60px rgba(31,35,40,.30)}
  .modal.open .box{transform:none}
  .modal .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
    border-bottom:1px solid rgba(128,128,128,.18);background:var(--card-bg);color:var(--text);font-size:13px}
  /* 标题栏左侧：项目 logo + 品牌名（打开后台时由 setAdminTitle 填） */
  .modal .bar #modalTitle{display:flex;align-items:center;gap:8px;font-weight:600}
  .modal .bar .mt-logo{width:18px;height:18px;border-radius:5px;display:block;flex:none}
  .modal .bar .close{background:none;border:0;color:var(--text-dim);cursor:pointer;font-size:18px;padding:4px 10px;border-radius:8px;
    transition:background .15s,color .15s}
  .modal .bar .close:hover{background:rgba(128,128,128,.18);color:var(--text)}
  .modal iframe{flex:1;border:0;background:var(--card-bg)}
  /* 后台组件的挂载点：和 iframe 二选一显示（iframe 仍留给「在弹窗里打开卡片链接」）。
     --sp-bg 由后台自己的 CSS 提供，没加载完时退回卡片底色。 */
  .modal #adminRoot{flex:1;min-height:0;overflow:auto;background:var(--sp-bg,var(--card-bg));
    -webkit-overflow-scrolling:touch;
    /* 始终预留滚动条槽位：分组从长变短、切换面板时滚动条会突然出现/消失，
       内容宽度跟着变 8px，「添加分组」这类贴右的按钮就会横向抖一下 */
    scrollbar-gutter:stable}
  .modal #adminRoot[hidden]{display:none}
  /* 后台包里带 1.3 MB 资源，首次打开要等一下，先给个占位 */
  .modal #adminRoot .adm-boot{display:flex;align-items:center;justify-content:center;gap:10px;height:100%;
    color:var(--text-dim);font-size:13px;letter-spacing:.5px}
  .modal #adminRoot .adm-boot i{width:14px;height:14px;border-radius:50%;display:inline-block;
    border:2px solid rgba(128,128,128,.28);border-top-color:var(--text-dim);animation:admSpin .7s linear infinite}
  @keyframes admSpin{to{transform:rotate(360deg)}}

  /* ---------- 内置组件面板（日历 / 备忘录 / 待办） ----------
     背景用接近实色的底：面板里是文字和大片留白，沿用 .modal 的 0.82 半透明底
     会把背后壁纸的色块透上来，看着发脏；这里单独加深并提高模糊半径。 */
  .modal.wp .box{width:min(880px,94vw);height:min(620px,86vh);
    background:rgba(28,31,36,.95);backdrop-filter:blur(26px) saturate(1.15);-webkit-backdrop-filter:blur(26px) saturate(1.15)}
  html[data-theme="light"] .modal.wp .box{background:rgba(255,255,255,.96)}
  .modal.wp .bar{background:transparent}
  #wpBody{flex:1;min-height:0;display:flex;overflow:hidden}
  .wp-boot{display:flex;align-items:center;justify-content:center;width:100%;min-height:180px;color:var(--text-dim);font-size:13px}
  /* 组件卡片的图标用组件自己的主色（--wc，由 renderGroups 内联写入；
     没配就是品牌蓝 #409EFF，见 /api/public/widget-meta 的 defaultColor），
     和普通卡片的图片/文字图标区分开。
     选择器必须带 html[data-theme]：主题里有一条 html[data-theme="light"] .card .ic.plain
     会把 .ic 的颜色压回 --text，权重比 .card.is-widget .ic 高。 */
  html[data-theme="light"] .card.is-widget .ic,
  html[data-theme="dark"] .card.is-widget .ic,
  html:not([data-theme]) .card.is-widget .ic{color:var(--wc,var(--accent))}
  /* 组件图标的画法（淡底 + 实心细节）见 libPath / 后端 ICON_LIBRARY：细节本身就占满 24 网格，
     所以比同类线性图标要「大一号」才在视觉重量上持平 —— 卡片 26px、小图标 36px。 */
  .card.is-widget .ic svg{width:26px;height:26px;display:block}
  /* 选了在线图标（Iconify）时是 <img>，尺寸跟内联 svg 对齐，彩色图标不套主色 */
  .card.is-widget .ic img.w-ico{width:26px;height:26px;display:block;object-fit:contain}
  html[data-theme="light"] .mini.is-widget .mic,
  html[data-theme="dark"] .mini.is-widget .mic,
  html:not([data-theme]) .mini.is-widget .mic{color:var(--wc,var(--accent))}
  .mini.is-widget .mic svg{width:36px;height:36px;display:block}
  .mini.is-widget .mic img.w-ico{width:36px;height:36px;display:block;object-fit:contain}

  /* 日历
     排版参考系统日历：顶部胶囊导航 + 周行 + 大号日期/农历脚注。
     格子平时不上底色，只有「今天 / 法定节假日 / 调休上班」这三种状态才上色，
     视觉重心全落在日期数字上；背后压一个超大月份水印当装饰。 */
  .wp-cal{--cal-red:#e5484d;--cal-blue:var(--wc,var(--accent));
    position:relative;overflow:hidden;flex:1;display:flex;flex-direction:column;
    padding:12px 20px 14px;min-width:0}
  html[data-theme="dark"] .wp-cal{--cal-red:#f06b70}
  /* 水印压在日历格正中：文字尺寸随面板高度走，用 translate 居中而不是算百分比，
     不然月份行 / 周行高度一变就偏 */
  .cal-wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:0;
    font-size:min(42vh,290px);font-weight:700;
    line-height:.78;letter-spacing:-.05em;color:var(--text);opacity:.032;pointer-events:none;
    user-select:none;font-variant-numeric:tabular-nums}
  html[data-theme="dark"] .cal-wm{opacity:.03}
  .cal-bar,.cal-week,.cal-grid{position:relative;z-index:1}
  .cal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .cal-nav{display:flex;align-items:center;gap:8px}
  .cal-pill{display:flex;align-items:center;height:32px;padding:0 3px;border-radius:10px;background:rgba(128,128,128,.11)}
  .cal-pill b{display:block;min-width:44px;text-align:center;font-size:13.5px;font-weight:600;
    color:var(--text);letter-spacing:.2px;font-variant-numeric:tabular-nums}
  .cal-pill.m b{min-width:34px}
  .cal-ar{width:24px;height:24px;border:0;border-radius:7px;background:transparent;color:var(--text-dim);
    font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s}
  .cal-ar:hover{background:rgba(128,128,128,.2);color:var(--text)}
  .cal-today{height:32px;padding:0 14px;border:0;border-radius:10px;background:rgba(128,128,128,.11);
    color:var(--text);font-size:12.5px;cursor:pointer;transition:background .15s}
  .cal-today:hover{background:rgba(128,128,128,.2)}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
  .cal-week span{text-align:center;font-size:12px;color:var(--text-dim);padding:6px 0 4px;letter-spacing:.5px}
  .cal-week span.we{color:var(--cal-red)}
  .cal-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:2px;min-height:0}
  .cal-d{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border-radius:12px;min-height:0;transition:background .15s}
  .cal-d:hover{background:rgba(128,128,128,.09)}
  .cal-d .cd{position:relative;font-size:20px;font-weight:600;color:var(--text);line-height:1.1;
    letter-spacing:.2px;font-variant-numeric:tabular-nums}
  .cal-d .cl{font-size:10.5px;color:var(--text-dim);line-height:1.2;white-space:nowrap}
  .cal-d .cl.fest{color:var(--cal-blue)}
  /* 非本月的日期只留个影子，点它没有意义，也不该抢当前月注意力 */
  .cal-d.out .cd{color:var(--text-dim);opacity:.8}
  .cal-d.out .cl{opacity:.6}
  .cal-d.we .cd{color:var(--cal-red)}
  /* 法定节假日：整片浅红底 + 红字，连成一段假期的视觉块 */
  .cal-d.off,.cal-d.off:hover{background:rgba(229,72,77,.075)}
  html[data-theme="dark"] .cal-d.off{background:rgba(229,72,77,.11)}
  .cal-d.off:hover{background:rgba(229,72,77,.13)}
  .cal-d.off .cd{color:var(--cal-red)}
  .cal-d.off .cl{color:rgba(229,72,77,.78)}
  html[data-theme="dark"] .cal-d.off .cl{color:rgba(240,107,112,.8)}
  .cal-d.off .cl.fest{color:var(--cal-blue)}
  /* 调休上班：灰底，且覆盖周末红字 —— 这天本来就放假不了，还标红等于骗人 */
  .cal-d.duty{background:rgba(128,128,128,.1)}
  .cal-d.duty .cd{color:var(--text)}
  .cal-d.duty .cl{color:var(--text-dim)}
  /* 休/班 角标：挂在日期数字右上角，9px 小字，别抢主数字 */
  .cal-d .cb{position:absolute;top:-4px;right:-13px;padding:0 3px;border-radius:4px;
    font-size:9px;font-style:normal;font-weight:700;line-height:12px;letter-spacing:0}
  .cal-d .cb.rest{background:rgba(229,72,77,.14);color:var(--cal-red)}
  .cal-d .cb.duty{background:rgba(128,128,128,.2);color:var(--text-dim)}
  .cal-d.today,.cal-d.today:hover{background:var(--cal-blue)}
  .cal-d.today .cd{color:#fff}
  .cal-d.today .cl,.cal-d.today .cl.fest{color:rgba(255,255,255,.88)}
  .cal-d.today .cb.rest,.cal-d.today .cb.duty{background:rgba(255,255,255,.26);color:#fff}

  /* 备忘录 */
  .wp-memo{flex:1;display:flex;min-width:0;min-height:0}
  .mm-side{width:228px;flex:none;display:flex;flex-direction:column;min-height:0;border-right:1px solid rgba(128,128,128,.18)}
  .mm-sidehead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;
    font-size:14px;font-weight:600;color:var(--text)}
  /* 加号用内联 svg 而不是「＋」字符：全角字形本身带侧边留白、基线又偏下，
     24px 的方按钮里怎么调 line-height 看着都不居中；svg 是几何图形，flex 居中就是真的居中 */
  .mm-new{width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:0;
    border:0;border-radius:7px;background:var(--wc,var(--accent));color:#fff;cursor:pointer}
  .mm-new svg{width:16px;height:16px;display:block}
  .mm-new:hover{filter:brightness(1.08)}
  .mm-list{flex:1;overflow:auto;padding:0 8px 10px}
  .mm-item{display:flex;flex-direction:column;gap:2px;width:100%;padding:8px 10px;margin-bottom:4px;

<script>
/* ---------- 首帧反闪（主题 / 布局变量）----------
   主题、留白、背景模糊这些都在服务端 config 里，页面要等 fetch /api/public/panel 返回
   才知道当前值。可 HTML 上写死的是 data-theme="dark"，而壁纸是浅色 → 每次刷新都是一次
   「深灰空页 → 浅色壁纸」的明暗跳变，看起来就是「闪了一下」。
   所以这里在解析 body 之前，把上一次持久化的值先写回去；本段是同步脚本、无外部依赖，
   不会阻塞也不会有二次跳变。applyConfig 拿到新鲜配置后会重新写一次，缓存始终追平服务端。 */
(function(){
  try {
    var raw = localStorage.getItem('udenav.config');
    if (!raw) return;
    var c = JSON.parse(raw);
    if (!c || typeof c !== 'object') return;
    var root = document.documentElement;
    if (c.theme === 'light' || c.theme === 'dark') root.dataset.theme = c.theme;
    if (c.margin_top != null) root.style.setProperty('--mt', c.margin_top + 'vh');
    if (c.background_blur != null) root.style.setProperty('--blur', 'blur(' + c.background_blur + 'px)');
    if (c.background_mask != null) root.style.setProperty('--mask', c.background_mask);
    /* 宽度自适应存的是档位百分比（50/60/70/80），0/空 = 关闭走固定宽度；
       老数据是布尔式的 1，折算成 80，别让老用户升级后看着「开着却没效果」 */
    var autoW = Number(c.content_width_auto) === 1 ? 80 : (Number(c.content_width_auto) || 0);
    if (autoW >= 20 && autoW <= 100) root.style.setProperty('--cmw', autoW + 'vw');
    else if (c.content_max_width != null) root.style.setProperty('--cmw', c.content_max_width + 'px');
    if (c.show_clock === 0) root.classList.add('no-clock');
    if (c.title) document.title = c.title;
  } catch (e) {}
})();
</script>

/* ---------- 首帧反闪（背景图）----------
   壁纸同样在 config 里（存的是 base64 data URL，跟页面一起返回）。上面那段在 head 里跑，
   那时 <body> 还没解析、#bg 拿不到，所以壁纸这部分必须等 #bg 出来再铺，放在它后面。
   html 本身也铺一份同样的壁纸 + 同色遮罩：滚动条占的十几 px 在布局视口之外，
   fixed 定位的 #bg 铺不到那里，不补会露出一条刺眼的白缝。 */
(function(){
  try {
    var raw = localStorage.getItem('udenav.config');
    if (!raw) return;
    var c = JSON.parse(raw);
    var url = (typeof c.background_image === 'string' ? c.background_image : '').trim();
    if (!url) return;
    var isDark = (c.theme || 'dark') === 'dark';
    var maskV = (c.background_mask == null) ? 0.2 : c.background_mask;
    var tint = isDark ? 'rgba(0,0,0,' + maskV + ')' : 'rgba(255,255,255,' + maskV + ')';
    var bgEl = document.getElementById('bg');
    if (bgEl) { bgEl.style.backgroundImage = 'url("' + url + '")'; bgEl.style.display = 'block'; }
    document.documentElement.style.background =
      'linear-gradient(' + tint + ',' + tint + '), url("' + url + '") center / cover no-repeat fixed';
  } catch (e) {}
})();

<script>
const $ = s => document.querySelector(s);
const state = { config: {}, groups: [], engine: null, engines: [], intranet: false, admin: false, wmeta: null, caldays: null };

/* ---------- 渲染 ---------- */
/* 主题：访客页 CSS 认 data-theme，后台 theme.css 认 html.dark。
   后台现在是同文档组件，两边共用同一个 <html>，所以必须同时写这两个标记，
   否则会出现「后台变浅色、背后访客页还是深色」。 */
function applyThemeAttr(t) {
  const root = document.documentElement;
  const v = t === 'light' ? 'light' : 'dark';
  root.dataset.theme = v;
  root.classList.toggle('dark', v === 'dark');
}

/* ---------- 首帧反闪：把 config 缓存下来 ----------
   服务端 config 是权威源，这里只做「上一次已知配置」的副本，供 head/body 那两段内联脚本
   在 API 返回前把首帧拉回正确状态。背景图是 base64、体积不小，localStorage 超限时会抛错，
   所以先试全量，写不进去就退回不含壁纸的精简版（至少主题不闪）。 */
function cacheConfig(c) {
  const slim = {
    title: document.title, theme: c.theme, margin_top: c.margin_top,
    background_blur: c.background_blur, background_mask: c.background_mask,
    content_max_width: c.content_max_width, show_clock: c.show_clock,
  };
  const full = Object.assign({ background_image: c.background_image }, slim);
  try { localStorage.setItem('udenav.config', JSON.stringify(full)); }
  catch (e) { try { localStorage.setItem('udenav.config', JSON.stringify(slim)); } catch (e2) {} }
}

/* 背景应用：单张背景（旧）与壁纸库（多张）统一走这里。
   有 backgrounds 且非空 → 用库；否则回退到单张 background_image（兼容老数据）。
   background_rotate 为真且库 ≥2 张 → 定时轮播。applyConfig 每次调用先清旧计时器，避免重复叠加。 */
let bgTimer = null;
/* 轮播开关：状态只记本机（'0' = 手动暂停），默认播放；刷新后按它决定要不要转起来 */
const BGPLAY_KEY = 'udenav.bgplay';
let bgPaused = false;
try { bgPaused = localStorage.getItem(BGPLAY_KEY) === '0'; } catch (e) {}
/* 当前轮播安排（列表 / 当前下标 / 遮罩 / 间隔）。暂停时留着不动，点「继续」从当前这张往下接着走 */
let bgPlan = null;
function paintBg(url, maskV, isDark) {
  const u = String(url).replace(/"/g, '');
  $('#bg').style.backgroundImage = `url("${u}")`;
  $('#bg').style.display = 'block';
  const tint = isDark ? `rgba(0,0,0,${maskV})` : `rgba(255,255,255,${maskV})`;
  document.documentElement.style.background =
    `linear-gradient(${tint},${tint}), url("${u}") center / cover no-repeat fixed`;
}
/* 起停计时器唯一入口：有安排且没暂停才转，切换时先清旧的，不会叠出两个计时器 */
function syncBgTimer() {
  if (bgTimer) { clearInterval(bgTimer); bgTimer = null; }
  if (!bgPlan || bgPaused) return;
  bgTimer = setInterval(() => {
    bgPlan.idx = (bgPlan.idx + 1) % bgPlan.list.length;
    paintBg(bgPlan.list[bgPlan.idx], bgPlan.maskV, bgPlan.isDark);
  }, bgPlan.ms);
}
function applyBackground(c) {
  if (bgTimer) { clearInterval(bgTimer); bgTimer = null; }
  const maskV = c.background_mask ?? 0.2;
  const isDark = (c.theme || 'dark') === 'dark';
  const list = (Array.isArray(c.backgrounds) && c.backgrounds.length)
    ? c.backgrounds.filter(Boolean)
    : (c.background_image ? [c.background_image] : []);
  if (!list.length) {
    document.documentElement.style.background = '';
    $('#bg').style.display = 'none';
    document.body.style.background = isDark
      ? 'linear-gradient(155deg,#262c36 0%,#1c2027 42%,#272e38 100%)'
      : 'linear-gradient(160deg,#f4f7fa 0%,#eaeff3 55%,#f1f5f8 100%)';
    bgPlan = null;
    $('#bgBtn').hidden = true;
    paintBgBtn();
    return;
  }
  const active = (c.background_image && list.includes(c.background_image)) ? c.background_image : list[0];
  paintBg(active, maskV, isDark);
  /* 轮播间隔按分钟（1~60）。老数据只有 background_rotate_sec（秒），这里折算成分钟兜底 */
  let min = Number(c.background_rotate_min);
  if (!(min > 0)) min = Math.round((Number(c.background_rotate_sec) || 0) / 60) || 5;
  min = Math.min(60, Math.max(1, min));
  /* 只有一张壁纸时轮播不会有任何变化，开关也就没意义 —— 一并按「没开轮播」处理 */
  const canRotate = !!(c.background_rotate && list.length > 1);
  /* 后台把轮播关掉时顺手清掉本机的暂停记录：下次重新开启应该默认转起来，
     否则用户会对着一个永远停在原地、还说「已暂停」的按钮发懵 */
  if (!c.background_rotate && bgPaused) {
    bgPaused = false;
    try { localStorage.removeItem(BGPLAY_KEY); } catch (e) {}
  }
  bgPlan = canRotate
    ? { list, idx: Math.max(0, list.indexOf(active)), maskV, isDark, ms: min * 60000 }
    : null;
  $('#bgBtn').hidden = !canRotate;
  syncBgTimer();
  paintBgBtn();
}

function applyConfig(c) {
  state.config = c;
  document.title = c.logo_text || 'UDeNav';
  $('#logo').textContent = c.logo_text || 'UDeNav';
  $('#fav').setAttribute('href', String(c.favicon||'').trim() || $('#fav').dataset.def);
  applyThemeAttr(c.theme || 'dark');
  $('#themeBtn').innerHTML = svgOf(ICON[(c.theme || 'dark') === 'dark' ? 'moon' : 'sun']);
  applyBackground(c);
  document.documentElement.style.setProperty('--blur', `blur(${c.background_blur ?? 2}px)`);
  document.documentElement.style.setProperty('--mask', c.background_mask ?? 0.2);
  document.documentElement.style.setProperty('--mt', `${c.margin_top ?? 14}vh`);
  /* 宽度自适应：档位百分比（50/60/70/80）→ vw；0/空 = 关闭，用固定 content_max_width。
     老数据是 1，折算成 80。和上面首帧那段保持同一口径。 */
  {
    const autoW = Number(c.content_width_auto) === 1 ? 80 : (Number(c.content_width_auto) || 0);
    document.documentElement.style.setProperty('--cmw',
      (autoW >= 20 && autoW <= 100) ? `${autoW}vw` : `${c.content_max_width ?? 1200}px`);
  }
  document.documentElement.style.setProperty('--gmt', `${c.group_margin_top ?? 30}px`);
  document.documentElement.classList.toggle('no-clock', !c.show_clock);
  $('#footer').textContent = c.footer || '';
  $('#searchBox').style.display = c.search_box_show ? 'flex' : 'none';
  state.engines = Array.isArray(c.search_engines) && c.search_engines.length ? c.search_engines : DEFAULT_ENGINES;
  if (!state.engine || !state.engines.some(e => e.name === state.engine.name)) state.engine = state.engines[0];
  renderEngines();
  cacheConfig(c);   // 追平首帧反闪用的缓存：下次刷新不闪
}

const DEFAULT_ENGINES = [
  { name: '百度', url: 'https://www.baidu.com/s?wd=%s' },
  { name: 'Bing', url: 'https://www.bing.com/search?q=%s' },
  { name: 'Google', url: 'https://www.google.com/search?q=%s' },
];

function renderEngines() {

  $('#engList').innerHTML = '';
  state.engines.forEach((e, i) => {
    const b = document.createElement('button');

    b.onclick = () => { state.engine = e; renderEngines(); $('#engList').classList.remove('open'); };
    $('#engList').appendChild(b);

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function letter(t) { return (String(t || '').trim()[0] || '').toUpperCase(); }

/* ---------- 名称显示规则 ----------
   1) 字宽按中文/全角 1、英文数字 0.5 计（「哔哩哔哩」=4，「GitHub」=2.5）
   2) 名称（卡片标题、图标下方名称）：最多 6 个字宽，超出截断 + 省略号
   3) 小图标底板文字：最多 4 个字宽，超出直接截掉（无省略号）
   4) 底板字号随字数递减：1 个字最大，6 个字最小 */
const NAME_UNITS_MAX = 6;
const WIDE_CHAR = /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF\u3000\u2026]/;
const unitOf = ch => WIDE_CHAR.test(ch) ? 1 : 0.5;
function nameUnits(s) { let u = 0; for (const ch of String(s ?? '')) u += unitOf(ch); return u; }
function clipName(s) {
  const str = String(s ?? '');
  if (nameUnits(str) <= NAME_UNITS_MAX) return str;
  let out = '', u = 0;
  for (const ch of str) {
    const w = unitOf(ch);
    if (u + w > NAME_UNITS_MAX) break;   // 截断时保留 6 个实字，省略号另算（卡片最窄时 6字+… 仍放得下）
    out += ch; u += w;
  }
  return out + '…';
}
/* 小图标底板上的文字：最多 4 个字宽，超出直接截掉（不加省略号，底板里放不下） */
const PLATE_UNITS_MAX = 4;
function clipPlate(s) {
  const str = String(s ?? '');
  if (nameUnits(str) <= PLATE_UNITS_MAX) return str;
  let out = '', u = 0;
  for (const ch of str) {
    const w = unitOf(ch);
    if (u + w > PLATE_UNITS_MAX) break;
    out += ch; u += w;
  }
  return out;
}
/* 图标底板上的文字按字数分档缩放（70px 底板内要放得下）；卡片标题与下方名称字号固定，不参与缩放
   字号上限 18px：1~2 个字也不再放大到 32/26px，避免小底板里字撑满、看着发闷 */
const FS_TEXT = { 1: 18, 2: 18, 3: 16, 4: 15, 5: 13, 6: 12 };
const FS_TEXT_MAX = 18;
function fsOf(t) {
  const u = Math.max(1, Math.min(NAME_UNITS_MAX, Math.ceil(nameUnits(t))));
  return FS_TEXT[u];
}

/* ---------- 悬停提示：替代浏览器原生 title ----------
   原生 title 的气泡由系统绘制（灰底、直角、延迟不可控），这里统一换成自定义气泡：
   深色主题黑底白字、浅色主题白底黑字，圆角 + 箭头 + 淡入。
   用法：元素加 data-tip="文案" 即可；data-tip-pos="right" 让气泡出现在右侧（组名描述用）。
   不要再写 title，否则原生气泡和自定义气泡会同时出现 */
const tipEl = document.createElement('div');
tipEl.className = 'tip';
document.body.appendChild(tipEl);
let tipTimer = 0, tipHost = null;

function tipHide() {
  clearTimeout(tipTimer);
  tipHost = null;
  tipEl.classList.remove('on');
}

function tipShow(host) {
  const text = host.dataset.tip;
  if (!text) return;
  tipEl.textContent = text;
  tipEl.style.left = '-9999px';
  tipEl.style.top = '0px';
  tipEl.classList.add('on');                       // 先上屏，才能量到气泡真实尺寸
  const r = host.getBoundingClientRect();
  const tr = tipEl.getBoundingClientRect();
  const gap = 9;
  const clampX = x => Math.max(8, Math.min(x, window.innerWidth - tr.width - 8));
  const clampY = y => Math.max(8, Math.min(y, window.innerHeight - tr.height - 8));

  if ((host.dataset.tipPos || 'top') === 'right') {
    /* 右侧出泡：垂直居中于元素，水平排在元素右边；右边放不下再翻到左边 */
    let x = r.right + gap;
    if (x + tr.width > window.innerWidth - 8) x = Math.max(8, r.left - tr.width - gap);
    const y = clampY(r.top + r.height / 2 - tr.height / 2);
    tipEl.style.left = x + 'px';
    tipEl.style.top = y + 'px';
    tipEl.classList.remove('below');
    tipEl.classList.add('right');
    tipEl.style.setProperty('--ay', Math.max(11, Math.min(tr.height - 11, r.top + r.height / 2 - y)) + 'px');
    return;
  }

  let below = false;
  let y = r.top - tr.height - gap;
  if (y < 8) { below = true; y = r.bottom + gap; }  // 上方放不下就翻到下方
  const x = clampX(r.left + r.width / 2 - tr.width / 2);
  tipEl.style.left = x + 'px';
  tipEl.style.top = y + 'px';
  /* 箭头对准元素中心，同时夹在气泡两端的圆角以内 */
  const ax = Math.max(11, Math.min(tr.width - 11, r.left + r.width / 2 - x));
  tipEl.style.setProperty('--ax', ax + 'px');
  tipEl.classList.remove('right');
  tipEl.classList.toggle('below', below);
}

document.addEventListener('mouseover', e => {
  const host = e.target.closest && e.target.closest('[data-tip]');
  if (!host || host === tipHost) return;
  tipHost = host;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => { if (tipHost === host) tipShow(host); }, 240);
});
document.addEventListener('mouseout', e => {
  const host = e.target.closest && e.target.closest('[data-tip]');
  if (!host || host !== tipHost) return;
  const to = e.relatedTarget;
  if (to && host.contains(to)) return;   // 在同一元素内部移动，不收起
  tipHide();
});
/* 滚动、缩放、点击、右键都应立刻收起，避免气泡留在原地 */
addEventListener('scroll', tipHide, true);
addEventListener('resize', tipHide);
document.addEventListener('pointerdown', tipHide, true);
document.addEventListener('contextmenu', tipHide, true);

/* 兜底：字宽算出来的字号仍可能放不下（如英文单词偏宽），渲染后按真实字宽再缩。
   不用 el.scrollWidth 量宽 —— 元素带 text-overflow:ellipsis 时它的返回值语义
   和「是否截断」对不上（曾导致「哔哩哔哩」被截成「哔哩哔…」）。
   用隐藏探针量纯文本宽度：宽度对照底板的 clientWidth（玻璃底板有 1px 边框，
   clientWidth=68 而不是 70），留 1px 安全余量，最多缩 3 轮 */
function fitNames(root) {
  (root || document).querySelectorAll('.mtext').forEach(el => {
    if (!el.textContent) return;
    const plate = el.parentElement;
    const limit = (plate ? plate.clientWidth : 0) * 0.76 - 1;   // 与 max-width:76% 一致，再留 1px
    if (limit <= 0) return;
    const probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;left:-9999px;top:0;white-space:nowrap';
    probe.style.font = getComputedStyle(el).font;
    probe.style.letterSpacing = getComputedStyle(el).letterSpacing;
    probe.textContent = el.textContent;
    plate.appendChild(probe);
    try {
      for (let i = 0; i < 3; i++) {
        const w = probe.getBoundingClientRect().width;
        if (w <= limit) break;
        const cur = parseFloat(getComputedStyle(el).fontSize);
        const next = Math.max(11, cur * limit / w);
        if (next >= cur - 0.05) break;
        el.style.fontSize = next.toFixed(1) + 'px';
        probe.style.fontSize = el.style.fontSize;
      }
    } finally {
      probe.remove();
    }
  });
}

/* 在线图标该用什么颜色画：iconify 是 <img>，颜色必须在 URL 上带过去（服务端写进 SVG）。
   规则与底板上的文字色一致：
   - 设了背景色 → 深底配白、浅底配深（按亮度判断，不然浅黄底上白图标等于没有）
   - 没设背景色 → 暗色主题白、浅色主题 var(--text) 的 #606266 */
function readableOn(c) {
  const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(c || '').trim());
  if (!m) return '#ffffff';                       // rgba / 带 alpha 的串判断不了，按深底处理
  let h = m[1];
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const r = parseInt(h.slice(0, 2), 16) / 255;
  const g = parseInt(h.slice(2, 4), 16) / 255;
  const b = parseInt(h.slice(4, 6), 16) / 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 0.62 ? '#1f2328' : '#ffffff';
}
function iconColor(item) {
  const c = String(item.color || '').trim();
  if (c) return readableOn(c);
  return document.documentElement.dataset.theme === 'light' ? '#606266' : '#ffffff';
}

/* 图片类图标 → <img>，不是图片就返回空串，交给调用方自己出文字。
   这是唯一按 iconType 分流的地方：
   data/r2 + 有图 → 直接图片；iconify + 有图标名 → 走 /api/icon 代理取 SVG。 */
function iconImg(item) {
  const t = item.iconType;
  if ((t === 'data' || t === 'r2') && item.iconUrl)
    return `<img src="${esc(item.iconUrl)}" alt="" loading="lazy">`;
  if (t === 'iconify' && item.iconName)
    return `<img src="/api/icon?name=${encodeURIComponent(item.iconName)}&color=${iconColor(item).slice(1)}" alt="" loading="lazy">`;
  /* 兼容极旧数据：有 iconUrl 但没带 iconType 的，仍当图片处理 */
  if (item.iconUrl)
    return `<img src="${esc(item.iconUrl)}" alt="" loading="lazy">`;
  return '';
}

/* 卡片模式（46px 底板）：图片优先，否则文字（自定义图标文字，留空取标题首字） */
function iconHtml(item) {
  const im = iconImg(item);
  if (im) return im;
  const custom = String(item.iconText || '').trim();
  if (custom) {
    const tx = clipPlate(custom);
    /* 46px 底板：fsOf 的分档字号对 3 字（16px×3=48px）会溢出换行，
       按「字宽单位 × 字号 ≤ 40px」压字号——左右各留 3px，不贴边、不换行 */
    const fs = Math.min(fsOf(tx), 40 / Math.max(1, nameUnits(tx)));
    return `<span style="font-size:${fs.toFixed(1)}px">${esc(tx)}</span>`;
  }
  return `<span>${esc(letter(item.title))}</span>`;
}

/* 小图标模式（70px 底板）：文字必须保留 class="mtext"。
   .mtext 承载加粗、颜色、76% 限宽、fitNames 的自动缩字——丢了 class 文字就不粗也不缩 */
function iconMiniInner(item, plateTxt) {
  const im = iconImg(item);
  if (im) return im;
  return `<span class="mtext" style="--fs:${fsOf(plateTxt)}px">${esc(plateTxt)}</span>`;
}

function renderGroups(instant) {
  const box = $('#groups');
  const kw = $('#q').value.trim().toLowerCase();
  const filtered = state.groups.filter(g => {
    if (g.cardStyle === 'hide') return false;
    return g.items.filter(it => !kw || (it.title + ' ' + (it.description || '') + ' ' + (it.url || '')).toLowerCase().includes(kw));
  });
  box.innerHTML = '';
  if (!filtered.length) {
    /* 一个分组都没有（未登录且没有「免登录可见」的分组）时只保留头部，不显示空态文案 */
    box.innerHTML = state.groups.length ? '<div class="empty">没有匹配的卡片</div>' : '';
    return;
  }
  filtered.forEach(g => {
    const sec = document.createElement('section');
    sec.className = 'group';
    /* 登录后在分组标题后面挂一个「＋」：直接往该分组加一条导航，
       不用先进后台、再找分组、再点添加卡片 */
    const addBtn = state.admin
      ? `<button type="button" class="g-add" data-add="${g.id}"` +
        ` data-tip="向「${esc(g.title)}」添加卡片" aria-label="添加卡片">${svgOf(ICON.plus)}</button>`
      : '';
    /* 分组图标（可选）：在线图标走 /api/icon 代理，颜色固定白色 ——
       标题用的是 --on-bg，两个主题都刻意锁白（压在壁纸上），图标必须跟着标题走，
       所以这里不能像卡片图标那样按主题取色。加 drop-shadow 代替 text-shadow，
       浅色壁纸上才不会糊成一片。上传型图标（iconUrl）优先，兼容历史数据 */
    const gIcon = g.icon
      ? `<img class="g-ico" src="/api/icon?name=${encodeURIComponent(g.icon)}&color=ffffff" alt="" loading="lazy" onerror="this.remove()">`
      : g.iconUrl
        ? `<img class="g-ico" src="${esc(g.iconUrl)}" alt="" loading="lazy" onerror="this.remove()">`
        : '';
    sec.innerHTML = `<div class="group-head"><h2${g.description ? ` data-tip="${esc(g.description)}" data-tip-pos="right"` : ''}>${gIcon}${esc(g.title)}</h2>${addBtn}</div>`;
    const grid = document.createElement('div');
    grid.className = g.cardStyle === 'icon' ? 'grid icons' : 'grid';
    g.items.forEach(it => {
      const isW = isWidget(it);
      if (g.cardStyle === 'icon') {
        /* 小图标模式（参照 sun-panel）：未设背景色用玻璃底板（同卡片），设了则用实色 */
        const plate = it.color ? ` style="background:${esc(it.color)}"` : '';
        const micCls = it.color ? 'mic' : 'mic plain';
        const short = clipName(it.title);
        /* 底板文字：自定义图标文字优先，留空取标题；同样 4 字宽封顶 */
        const plateTxt = clipPlate(String(it.iconText || '').trim() || it.title);
        /* 内置组件用组件自己的图标（图标变体可在后台「组件管理」里换），
           不跟随卡片的图标/文字配置 —— 组件的身份要一眼可辨 */
        const inner = isW ? widgetIcon(it) : iconMiniInner(it, plateTxt);
        const c = document.createElement('div');
        c.className = 'mini' + (isW ? ' is-widget' : '');
        if (isW) { const wc = widgetColor(it); if (wc) c.style.setProperty('--wc', wc); }
        c.dataset.id = String(it.id ?? '');
        c.dataset.gid = String(g.id);
        /* 底板下方的名称：所有小图标卡片都渲染（图片图标、文字图标都要有名字） */
        const label = `<span class="mname">${esc(short)}</span>`;
        c.innerHTML = `<span class="${micCls}"${plate}>${inner}</span>${label}`;
        c.onclick = () => (isW ? openWidget(it) : openUrl(it));
        grid.appendChild(c);
        return;
      }
      const c = document.createElement('div');
      c.className = 'card' + (isW ? ' is-widget' : '');
      if (isW) { const wc = widgetColor(it); if (wc) c.style.setProperty('--wc', wc); }
      const short = clipName(it.title);
      c.dataset.id = String(it.id ?? '');
      c.dataset.gid = String(g.id);
      /* 未设背景色时给 plain：走玻璃底板，而不是内联一块纯黑。
         之前这里恒写 `it.color || '#2a2a2a'`，用户把背景色清空后底板上
         还压着一块 #2a2a2a 实色，看起来像「清不掉」 */
      c.innerHTML = `<div class="ic${it.color ? '' : ' plain'}"${it.color ? ` style="background:${esc(it.color)}"` : ''}>${isW ? widgetIcon(it) : iconHtml(it)}</div>`
        + `<div class="body"><div class="title">${esc(short)}</div>${it.description ? `<div class="dsc">${esc(it.description)}</div>` : ''}</div>`;
      c.onclick = () => (isW ? openWidget(it) : openUrl(it));
      grid.appendChild(c);
    });
    sec.appendChild(grid);
    box.appendChild(sec);
  });
  /* 名称按实际渲染宽度再兜底缩一次（英文偏宽的情况） */
  fitNames(box);
  /* 输入过滤 / 回车清空 / 点清除键后的重建：不重播入场动画。
     重出来的节点没有 .in（opacity:0 初始态），不补显示的话整片图标会「消失」；
     只补视口内的，滚动到下面的仍交给 initMotion 的 IntersectionObserver */
  if (instant) {
    document.querySelectorAll('#groups .group:not(.in), #groups .card:not(.in), #groups .mini:not(.in)').forEach(el => {
      if (el.getBoundingClientRect().top < innerHeight + 200) {
        /* animation:none 必须加：.in 的 rise/cardIn 动画期间 keyframes 会盖过内联 opacity，
           不压掉的话每敲一个字整片卡片就重播一遍上浮动画（闪） */
        el.style.setProperty('animation', 'none');
        el.style.setProperty('opacity', '1');
        el.classList.add('in');
      }
    });
  }
}

/* 内外网互为兜底：开关选「内网」但这张卡没配内网地址 → 直接开外网地址；反之没配外网 → 开内网地址 */
function pickUrl(it) {
  const wan = String(it.url || '').trim();
  const lan = String(it.lanUrl || '').trim();
  return state.intranet ? (lan || wan) : (wan || lan);
}

/* 只允许 http/https 跳转：卡片 URL 来自数据库（管理员/导入可写入），
   若被写入 javascript: 等伪协议，location.href / window.open 会执行脚本（存储型 XSS）。
   统一在这里拦掉非 http/https 的地址。 */
function safeUrl(u) {
  if (!u) return null;
  try {
    const t = new URL(u, location.origin);
    return t.protocol === 'http:' || t.protocol === 'https:' ? t.href : null;
  } catch {
    return null;
  }
}

function openUrl(it) {
  const url = safeUrl(pickUrl(it));
  if (!url) { ctxToast('链接无法打开（仅支持 http/https）'); return; }
  if (it.openMethod === 3) {
    $('#modalTitle').textContent = it.title || url;
    const frame = $('#modalFrame');
    $('#adminRoot').hidden = true;   // 后台和 iframe 共用这个弹窗，得互相让位
    frame.style.display = '';
    frame.src = url;
    $('#modal').classList.add('open');
  } else if (it.openMethod === 1) {
    location.href = url;
  } else {
    window.open(url, '_blank');
  }
}

/* ============================================================
   内置组件（日历 / 备忘录 / 待办）
   组件在库里仍是一条 item_icon 记录，靠 kind 区分；真正的内容存在
   widget_data 表（仅登录可读写）—— 访客点组件卡片时提示先登录。
   ============================================================ */
/* 三个内置组件图标：统一「淡底 + 1.5 细描边 + 实心细节」的画法 ——
   底板 fill-opacity .2、外轮廓描边 1.5、细节实心，全部落在同一套 24×24 网格上。
   为什么不是纯淡底：只铺淡色时，图标剪影压在白色底板上会发虚、像是糊了；
   加一圈同色细线，轮廓立刻立住（纯淡底 / 更浓淡底 / 淡底+细线三版对比后选的这版）。

/* ---------- 组件外观 / 功能配置 ----------
   每个组件的图标形状 + 风格、主色、功能开关存在 item_icon.w_cfg（JSON 字符串），
   由后台「组件管理」写入；合法取值（有哪些图标、有哪些风格）来自 /api/public/widget-meta，
   前台和后台读的是同一份定义，不在两边各硬编码一遍。 */
function wmetaOf(kind) {
  const list = (state.wmeta && state.wmeta.kinds) || [];
  return list.find(x => x.kind === kind) || null;
}
function widgetCfg(it) {
  let o = null;
  try { o = JSON.parse((it && it.wCfg) || '{}'); } catch (e) { o = null; }
  if (!o || typeof o !== 'object') o = {};
  const opts = (o.opts && typeof o.opts === 'object') ? o.opts : {};
  let icon = String(o.icon || ''), variant = String(o.variant || '');
  /* 兼容旧配置：旧版把「风格」存进了 icon 字段（那时还没有图标库），
     读到 dual/line/solid 就把它当风格，图标回到该组件的默认形状。
     不认这一条的话，老的 icon:"solid" 会命中不了图标库，卡片图标直接退成日历。 */
  if (!variant && /^(dual|line|solid)$/.test(icon)) { variant = icon; icon = ''; }
  return { icon, variant, color: String(o.color || ''), opts };
}
/* 主色：组件自己配的 → 全局默认（/api/public/widget-meta 的 defaultColor，即 logo 蓝）→ 写死的品牌蓝。
   最后一档是给「接口没回来 / 离线打开」兜底的：宁可显示项目色，也不要退回主题绿把三种颜色混在一起。
   通过 --wc 变量下发，图标、日历「今天」格、待办勾选这些地方共用同一个色 */
function widgetColor(it) {
  return widgetCfg(it).color || (state.wmeta && state.wmeta.defaultColor) || '#409EFF';
}
/* 按「图标形状 + 风格」解出要画的 SVG 内部标记：优先用接口返回的图标库，
   离线时退回内置三枚兜底。形状没配 → 该组件默认图标；风格没配 → dual。 */
function libPath(name, variant) {
  const lib = (state.wmeta && state.wmeta.library) || WIDGET_LIB;
  const ic = lib.find(x => x.key === name) || lib.find(x => x.key === 'cal');
  const v = (variant === 'line' || variant === 'solid') ? variant : 'dual';
  return ic ? (ic[v] || ic.dual) : '';
}
/* 在线图标名（Iconify，形如 flat-color-icons:calendar）：
   和 w_cfg.icon 里的内置图标 key 靠「有没有冒号」区分，后端入库前已按同一规则校验过 */
const ICONIFY_RE = /^[a-z0-9-]+:[a-z0-9-]+$/;
const isIconifyIcon = v => ICONIFY_RE.test(String(v || '').trim());

function widgetIcon(it) {
  const kind = (it && it.kind) || 'calendar';
  const cfg = widgetCfg(it);
  /* 选了在线图标就走代理取 SVG：彩色图标自带颜色（主色对它无效），单色图标
     靠 URL 上的 color 参数上色（和底板上的图标同一套规则） */
  if (isIconifyIcon(cfg.icon)) {
    const c = widgetColor(it).replace('#', '');
    return `<img class="w-ico" src="/api/icon?name=${encodeURIComponent(cfg.icon)}&color=${c}" alt="" loading="lazy">`;
  }
  const name = cfg.icon || (wmetaOf(kind) ? wmetaOf(kind).icon : (WIDGET_DEFICON[kind] || 'cal'));
  return svgOf(libPath(name, cfg.variant));
}
/* 面板里当前打开那个组件的开关值：库里存的 0/1 优先，没配过用 meta 里的默认值 */
function widgetOpt(key, dflt) {
  const v = widgetCfg(wpItem).opts[key];
  if (v === 0 || v === 1) return v;
  const t = ((wmetaOf(wpKind) || {}).toggles || []).find(x => x.key === key);
  return t ? t.def : dflt;
}
const fmtDT = ms => {
  const d = new Date(ms || Date.now()), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

let wpItem = null, wpKind = '', wpData = null, wpTimer = 0;

function openWidget(it) {
  /* 组件内容属于私人数据，接口要登录；未登录时别打开空面板，直接提示 */
  if (!state.admin) { ctxToast('请先登录后台再使用组件'); return; }
  wpItem = it; wpKind = it.kind;
  /* 待办默认落在「今天」：上次关面板前选的日期（比如明天）不该带到下一次，
     否则新任务会悄悄跑到别的日期里，看上去像「添加了却没出现」 */
  if (wpKind === 'todo') tdDue = todayKey();
  /* 面板里的强调色跟着这个组件的主色走（日历今天格、备忘录新建、待办勾选），
     不设就退回主题强调色 —— 与卡片图标同一个色，视觉上才是「这一张卡」 */
  const wc = widgetColor(it);
  if (wc) $('#wpanel').style.setProperty('--wc', wc);
  else $('#wpanel').style.removeProperty('--wc');
  $('#wpTitle').textContent = it.title || '组件';
  $('#wpanel').classList.add('open');
  $('#wpBody').innerHTML = '<div class="wp-boot">加载中…</div>';
  fetch('/api/admin/widgets/' + it.id, { headers: { 'X-Requested-With': 'unav' }, cache: 'no-store' })
    .then(r => (r.ok ? r.json() : Promise.reject(new Error(String(r.status)))))
    .then(j => { wpData = parseWidget(j.payload); renderWidget(); })
    .catch(() => { wpData = parseWidget(''); renderWidget(); });
  /* 日历没有实例数据，但「休 / 班」角标来自另一个接口：
     首次进页面时若那次请求失败（离线、限流），这里补一次，免得日历一直没角标 */
  if (wpKind === 'calendar') {
    refreshCalDays().then(() => { if (wpKind === 'calendar' && wpData) renderCalendar(); });
  }
}

/* 拉一次节假日表。单独成函数是因为三处都要用：
   首屏 init、后台改完后的 syncFromAdmin、以及打开日历时的兜底 */
function refreshCalDays() {
  return fetch('/api/public/cal-days', { cache: 'no-store' })
    .then(r => (r.ok ? r.json() : null))
    .then(j => { if (j && j.days && typeof j.days === 'object') state.caldays = j.days; })
    .catch(() => {});
}

function parseWidget(raw) {
  let o = {};
  try { o = JSON.parse(raw || '{}') || {}; } catch { o = {}; }
  if (wpKind === 'memo' && !Array.isArray(o.notes)) o.notes = [];
  if (wpKind === 'todo' && !Array.isArray(o.tasks)) o.tasks = [];
  return o;
}

function renderWidget() {
  if (wpKind === 'calendar') return renderCalendar();
  if (wpKind === 'memo') return renderMemo();
  if (wpKind === 'todo') return renderTodo();
}

/* 实时保存：输入时 600ms 防抖，关闭面板时强制落一次。
   PUT 整份 payload 覆盖，后端只做长度兜底。 */
function saveWidgetNow() {
  if (!wpItem || !wpData) return;
  clearTimeout(wpTimer);
  fetch('/api/admin/widgets/' + wpItem.id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'unav' },
    body: JSON.stringify({ payload: JSON.stringify(wpData) })
  }).catch(() => ctxToast('保存失败，请检查网络'));
}
function scheduleSave() { clearTimeout(wpTimer); wpTimer = setTimeout(saveWidgetNow, 600); }

function closeWidget() {
  closePrioPop();
  if (wpData) saveWidgetNow();
  $('#wpanel').classList.remove('open');
  $('#wpBody').innerHTML = '';
  wpItem = null; wpData = null;
}
$('#wpClose').onclick = closeWidget;
$('#wpanel').addEventListener('click', e => { if (e.target.id === 'wpanel') closeWidget(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#wpanel').classList.contains('open')) closeWidget();
});

/* ---------- 日历：公历 + 农历 + 二十四节气 ---------- */
let calY = new Date().getFullYear(), calM = new Date().getMonth();
const CAL_WEEK = ['一', '二', '三', '四', '五', '六', '日'];
const TERMS = ['小寒', '大寒', '立春', '雨水', '惊蛰', '春分', '清明', '谷雨', '立夏', '小满', '芒种', '夏至', '小暑', '大暑', '立秋', '处暑', '白露', '秋分', '寒露', '霜降', '立冬', '小雪', '大雪', '冬至'];
const TERM_MIN = [0, 21208, 42467, 63836, 85337, 107014, 128867, 150921, 173149, 195551, 218072, 240693, 263343, 285989, 308563, 331033, 353350, 375494, 397447, 419210, 440795, 462224, 483532, 504758];
/* 节气近似算法（1900—2100 有效，个别年份±1 天），足以做日历脚注 */
function termDay(y, i) {
  return new Date(31556925974.7 * (y - 1900) + TERM_MIN[i] * 60000 + Date.UTC(1900, 0, 6, 2, 5)).getUTCDate();
}
function termOf(y, m, d) {
  for (const i of [m * 2, m * 2 + 1]) if (termDay(y, i) === d) return TERMS[i];
  return '';
}
const LUNAR_FMT = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { month: 'long', day: 'numeric' });
const CN_NUM = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
function lunarDayName(n) {
  if (n === 10) return '初十';
  if (n < 10) return '初' + CN_NUM[n];
  if (n < 20) return '十' + CN_NUM[n - 10];
  if (n === 20) return '二十';
  if (n === 30) return '三十';
  return '廿' + CN_NUM[n - 20];
}
const LUNAR_FEST = { '正月1': '春节', '正月15': '元宵节', '五月5': '端午节', '八月15': '中秋节', '九月9': '重阳节', '腊月8': '腊八节' };
/* 公历固定节日。农历的节日在 LUNAR_FEST 里，这张表只放没有农历规律的那几个 */
const SOLAR_FEST = { '1-1': '元旦', '5-1': '劳动节', '10-1': '国庆节' };
/* 农历脚注：节气 > 传统节日 > 初一显示月名 > 否则农历日 */
function lunarInfo(y, m, d) {
  let mo = '', da = 1;
  try {
    const parts = LUNAR_FMT.formatToParts(new Date(y, m, d, 12));
    mo = (parts.find(p => p.type === 'month') || {}).value || '';
    da = Number((parts.find(p => p.type === 'day') || {}).value || 1);
  } catch { return ''; }
  return LUNAR_FEST[mo + da] || (da === 1 ? mo : lunarDayName(da));
}

/* ---------- 法定节假日 / 调休上班 ----------
   数据存在数据库里（后台「组件管理 → 日历 → 节假日」按年维护），前台只负责画：
   每年通知一发就要改代码重新部署，还容易漏；放后台后用户自己点几下就行。
   没取到数据（接口失败 / 那一年还没录）就干脆不画「休/班」角标 ——
   猜日期比不标更糟，标错了会直接误导出行和排班。 */
const calKey = (y, m, d) => y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
function calMark(y, m, d) {
  const v = (state.caldays || {})[calKey(y, m, d)];
  return v === 'work' ? '班' : (v === 'off' ? '休' : '');
}

function renderCalendar() {
  const now = new Date(), ty = now.getFullYear(), tm = now.getMonth(), td = now.getDate();
  /* 两个功能开关都在后台「组件管理」里设：周首日、农历/节气脚注 */
  const monFirst = widgetOpt('monFirst', 1);
  const showLunar = widgetOpt('lunar', 1);
  const weekRow = monFirst ? CAL_WEEK : ['日', '一', '二', '三', '四', '五', '六'];
  const firstDay = new Date(calY, calM, 1).getDay();
  const lead = monFirst ? (firstDay + 6) % 7 : firstDay;
  const dim = new Date(calY, calM + 1, 0).getDate();
  const cells = [];
  const prev = new Date(calY, calM, 0);
  for (let i = lead - 1; i >= 0; i--) cells.push({ y: prev.getFullYear(), m: prev.getMonth(), d: prev.getDate() - i, out: true });
  for (let d = 1; d <= dim; d++) cells.push({ y: calY, m: calM, d, out: false });
  for (let nx = 1; cells.length % 7 || cells.length < 35; nx++) {
    const dt = new Date(calY, calM + 1, nx);
    cells.push({ y: dt.getFullYear(), m: dt.getMonth(), d: dt.getDate(), out: true });
  }
  const grid = cells.map(c => {
    const isT = c.y === ty && c.m === tm && c.d === td;
    const wd = new Date(c.y, c.m, c.d).getDay();
    const term = showLunar ? termOf(c.y, c.m, c.d) : '';
    const fest = term || (showLunar ? (SOLAR_FEST[(c.m + 1) + '-' + c.d] || '') : '');
    const note = fest || (showLunar ? lunarInfo(c.y, c.m, c.d) : '');
    const mk = calMark(c.y, c.m, c.d);
    const cls = 'cal-d' + (c.out ? ' out' : '') + (wd === 0 || wd === 6 ? ' we' : '')
      + (mk === '休' ? ' off' : '') + (mk === '班' ? ' duty' : '') + (isT ? ' today' : '');
    return `<div class="${cls}">`
      + `<span class="cd">${c.d}${mk ? `<i class="cb ${mk === '休' ? 'rest' : 'duty'}">${mk}</i>` : ''}</span>`
      /* 关掉农历时不渲染这个 span，而不是渲染一个空标签：空行会让日期数字在格子里偏上 */
      + (note ? `<span class="cl${fest ? ' fest' : ''}">${esc(note)}</span>` : '')
      + '</div>';
  }).join('');

  $('#wpBody').innerHTML = `<div class="wp-cal">
    <div class="cal-wm">${calM + 1}</div>
    <div class="cal-bar">
      <div class="cal-nav">
        <div class="cal-pill">
          <button class="cal-ar" data-nav="py" aria-label="上一年">‹</button><b>${calY}</b><button class="cal-ar" data-nav="ny" aria-label="下一年">›</button>
        </div>
        <div class="cal-pill m">
          <button class="cal-ar" data-nav="pm" aria-label="上个月">‹</button><b>${calM + 1} 月</b><button class="cal-ar" data-nav="nm" aria-label="下个月">›</button>
        </div>
      </div>
      <button class="cal-today" data-nav="today">今天</button>
    </div>
    <div class="cal-week">${weekRow.map(w => `<span${w === '六' || w === '日' ? ' class="we"' : ''}>${w}</span>`).join('')}</div>
    <div class="cal-grid">${grid}</div>
  </div>`;
  $('#wpBody').querySelectorAll('[data-nav]').forEach(b => {
    b.onclick = () => {
      const v = b.dataset.nav;
      if (v === 'today') { const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); }
      else if (v === 'pm' || v === 'nm') {
        const d = new Date(calY, calM + (v === 'pm' ? -1 : 1), 1);
        calY = d.getFullYear(); calM = d.getMonth();
      } else calY += (v === 'py' ? -1 : 1);
      renderCalendar();
    };
  });
}

/* ---------- 备忘录：左侧列表 + 右侧编辑，输入即存 ---------- */
function renderMemo() {
  const showTime = widgetOpt('showTime', 1) === 1;
  const notes = wpData.notes;
  if (!notes.length) {
    notes.push({ id: 'n' + Date.now().toString(36), title: '', content: '', updatedAt: Date.now() });
    wpData.currentId = notes[0].id;
  }
  if (!notes.some(n => n.id === wpData.currentId)) wpData.currentId = notes[0].id;
  const cur = notes.find(n => n.id === wpData.currentId);
  const list = notes.map(n => `<button class="mm-item${n.id === cur.id ? ' on' : ''}" data-nid="${esc(n.id)}">`
    + `<span class="mm-t">${esc(n.title || '无标题')}</span>`
    + (showTime ? `<span class="mm-d">${fmtDT(n.updatedAt)}</span>` : '')
    + '</button>').join('');

  $('#wpBody').innerHTML = `<div class="wp-memo">
    <aside class="mm-side">
      <div class="mm-sidehead"><span>备忘录</span><button class="mm-new" data-act="new" aria-label="新建">${PLUS_SVG}</button></div>
      <div class="mm-list">${list}</div>
    </aside>
    <section class="mm-main">
      <input class="mm-title" data-act="title" placeholder="无标题" value="${esc(cur.title)}" />
      <textarea class="mm-body" data-act="body" placeholder="请输入备忘录内容">${esc(cur.content)}</textarea>
      <div class="mm-foot">
        ${showTime ? `<span class="mm-time">最后编辑：${fmtDT(cur.updatedAt)}</span>` : '<span></span>'}
        <button class="mm-del" data-act="del">删除</button>
      </div>
    </section>
  </div>`;

  const body = $('#wpBody');
  const titleEl = body.querySelector('.mm-title');
  const bodyEl = body.querySelector('.mm-body');
  const timeEl = body.querySelector('.mm-time');

  /* timeEl 可能不存在（「显示编辑时间」关掉时），这里必须判空再写 */
  const stamp = () => { cur.updatedAt = Date.now(); if (timeEl) timeEl.textContent = '最后编辑：' + fmtDT(cur.updatedAt); };

  body.querySelector('[data-act="new"]').onclick = () => {
    const n = { id: 'n' + Date.now().toString(36), title: '', content: '', updatedAt: Date.now() };
    /* 新建放最前还是最后，是组件管理里的开关（newFirst） */
    if (widgetOpt('newFirst', 1)) notes.unshift(n); else notes.push(n);
    wpData.currentId = n.id;
    renderMemo();
    saveWidgetNow();
  };
  body.querySelectorAll('.mm-item').forEach(el => {
    el.onclick = () => { wpData.currentId = el.dataset.nid; renderMemo(); };
  });
  titleEl.oninput = () => {
    cur.title = titleEl.value;
    stamp();
    /* 只改左侧那一行的文字，不整块重渲染 —— 否则每敲一个字输入框都会失焦 */
    const t = body.querySelector(`.mm-item[data-nid="${cur.id}"] .mm-t`);
    if (t) t.textContent = cur.title || '无标题';
    scheduleSave();
  };
  bodyEl.oninput = () => { cur.content = bodyEl.value; stamp(); scheduleSave(); };
  body.querySelector('[data-act="del"]').onclick = () => {
    if (notes.length === 1) { cur.title = ''; cur.content = ''; cur.updatedAt = Date.now(); }
    else wpData.notes = notes.filter(n => n.id !== cur.id);
    wpData.currentId = (wpData.notes[0] || {}).id;
    renderMemo();
    saveWidgetNow();
  };
}

/* ---------- 待办：今天 / 所有 / 待办事项 + 日期 + 优先级 ----------
   一条任务：{ id, text, done, createdAt, due: 'YYYY-MM-DD', prio: 0|1|2|3 }
   due / prio 是后加的字段，老数据没有：due 缺省时按「创建那天」算（以前就是这个口径），
   prio 缺省 = 无优先级，所以升级后老任务不会突然全部标成某个颜色。 */
let tdView = 'today';
let tdDue = '';                  // 新增任务默认落在哪天；首次用 todayKey() 填

const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayKey = () => ymd(new Date());
/* 四色优先级：红=高、黄=中、蓝=低、灰=无。p 存进数据，顺序也按这个排 */
const PRIO = [
  { p: 1, c: '#e5484d', label: '高' },
  { p: 2, c: '#f5a524', label: '中' },
  { p: 3, c: '#3b82f6', label: '低' },
  { p: 0, c: '', label: '无' }
];
const prioColor = p => ((PRIO.find(x => x.p === Number(p)) || {}).c || '');
/* 排位：高 → 中 → 低 → 无。空优先级排最后，而不是当成 p=0 排最前 */
const prioRank = t => { const p = Number(t.prio) || 0; return p ? p - 1 : 9; };

/* 任务的落点日期：有 due 用 due，老数据回退到创建日 */
function dueOf(t) {
  if (t && typeof t.due === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(t.due)) return t.due;
  return t && t.createdAt ? ymd(new Date(t.createdAt)) : '';
}
/* 日期文案：今天 / 明天 / 昨天 用相对说法，同年只给「M月D日」，跨年才补年份 */
function dueLabel(due) {
  const now = new Date();
  if (!due || due === todayKey()) return '今天';
  const d = new Date(due + 'T00:00:00');
  const diff = Math.round((d - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  if (diff === 1) return '明天';
  if (diff === -1) return '昨天';
  return d.getFullYear() === now.getFullYear()
    ? (d.getMonth() + 1) + '月' + d.getDate() + '日'
    : d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* 优先级气泡：挂在 body 上用 fixed 定位（.td-list 有 overflow，放行内会被裁掉）。
   全局只允许存在一个，点外面、切视图、关面板都会清掉 */
let prioPop = null;
function closePrioPop() {
  if (!prioPop) return;
  document.removeEventListener('mousedown', prioPop._off, true);
  prioPop.remove();
  prioPop = null;
}
function openPrioPop(anchor, cur, pick) {
  closePrioPop();
  const el = document.createElement('div');
  el.className = 'prio-pop';
  el.innerHTML = '<span class="pp-t">优先级</span>' + PRIO.map(x =>
    `<button data-p="${x.p}" class="${Number(cur) === x.p ? 'on' : ''}${x.p ? '' : ' none'}"`
    + (x.c ? ` style="--pc:${x.c}"` : '') + ` title="${x.label}"></button>`).join('');
  document.body.appendChild(el);

  const r = anchor.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = r.right - w, top = r.bottom + 6;
  if (left < 8) left = 8;
  if (left + w > innerWidth - 8) left = innerWidth - 8 - w;
  if (top + h > innerHeight - 8) top = r.top - h - 6;
  el.style.left = left + 'px';
  el.style.top = top + 'px';

  el.querySelectorAll('button').forEach(b => {
    b.onclick = () => { pick(Number(b.dataset.p)); closePrioPop(); };
  });
  /* mousedown 而不是 click：click 会晚于「打开另一个气泡」的 mousedown，
     先关后开才对；用 click 会出现关掉新气泡的情况 */
  const off = e => { if (!el.contains(e.target)) closePrioPop(); };
  el._off = off;
  setTimeout(() => document.addEventListener('mousedown', off, true), 0);
  prioPop = el;
}

function renderTodo() {
  const tasks = wpData.tasks;
  const showWhen = widgetOpt('showWhen', 1) === 1;
  /* 「今天」视图默认只列未完成的（列表重心是「还要做什么」）；
     打开 doneToday 就把已完成的也留在今天里，方便回头核对当天做完了什么 */
  const doneToday = widgetOpt('doneToday', 0) === 1;
  const today = todayKey();
  if (!tdDue) tdDue = today;
  const inToday = t => dueOf(t) === today && (doneToday || !t.done);
  const views = [
    { k: 'today', t: '今天', n: tasks.filter(inToday).length },
    { k: 'all', t: '所有', n: tasks.length },
    { k: 'open', t: '待办事项', n: tasks.filter(t => !t.done).length }
  ];
  /* 排序：未完成在前 → 日期早的在前 → 优先级高（p 小）的在前 → 新建的在前。
     先按日期是因为「所有」视图里跨天混排，光看优先级会让人找不到今天该干什么 */
  const cmp = (a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0)
    || String(dueOf(a)).localeCompare(String(dueOf(b)))
    || prioRank(a) - prioRank(b)
    || (b.createdAt || 0) - (a.createdAt || 0);
  const shown = (tdView === 'today'
    ? tasks.filter(inToday)
    : tdView === 'open'
      ? tasks.filter(t => !t.done)
      : tasks).slice().sort(cmp);

  const items = shown.length
    ? shown.map(t => {
      const p = Number(t.prio) || 0;
      const due = dueOf(t);
      const over = !t.done && due && due < today;
      return `<div class="td-item${t.done ? ' done' : ''}" data-tid="${esc(t.id)}">
        <button class="td-ck" data-act="toggle" aria-label="切换完成">${t.done ? '✓' : ''}</button>
        <span class="td-text">${esc(t.text)}</span>
        ${showWhen ? `<span class="td-when${over ? ' over' : ''}">${dueLabel(due)}</span>` : ''}
        <button class="td-prio${p ? ' on' : ''}" data-act="prio" title="设置优先级" aria-label="设置优先级"${p ? ` style="--pc:${prioColor(p)}"` : ''}></button>
        <button class="td-del" data-act="del" aria-label="删除">✕</button>
      </div>`;
    }).join('')
    : `<div class="td-empty"><span class="td-empty-ic">${svgOf(libPath('todo', 'dual'))}</span><p>赶快添加您的待办吧</p></div>`;

  const viewTitle = (views.find(v => v.k === tdView) || views[0]).t;
  const now = new Date();
  const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${WEEK[now.getDay()]}`;

  $('#wpBody').innerHTML = `<div class="wp-todo">
    <aside class="td-side">
      ${views.map(v => `<button class="td-nav${v.k === tdView ? ' on' : ''}" data-view="${v.k}">${v.t}<i>${v.n}</i></button>`).join('')}
    </aside>
    <section class="td-main">
      <div class="td-head"><h3>${viewTitle}</h3><span class="td-date">${dateStr}</span></div>
      <div class="td-add">
        <input class="td-input" placeholder="添加任务，回车确认" />
        <button class="td-due${tdDue === today ? ' today' : ''}" data-act="due" title="设置任务日期">${DUE_ICON}<span>${dueLabel(tdDue)}</span></button>
        <input type="date" class="td-due-in" value="${tdDue}" tabindex="-1" aria-hidden="true" />
        <button class="td-add-btn" data-act="add" aria-label="添加任务">${PLUS_SVG}</button>
      </div>
      <div class="td-list">${items}</div>
    </section>
  </div>`;

  const body = $('#wpBody');
  const input = body.querySelector('.td-input');
  const dueBtn = body.querySelector('[data-act="due"]');
  const dueIn = body.querySelector('.td-due-in');

  const add = () => {
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({
      id: 't' + Date.now().toString(36), text, done: false,
      createdAt: Date.now(), due: tdDue || today, prio: 0
    });
    renderTodo();
    saveWidgetNow();
    const again = $('#wpBody').querySelector('.td-input');
    if (again) again.focus();
  };
  input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add(); } };
  body.querySelector('[data-act="add"]').onclick = add;

  /* 日期按钮：借原生日期面板取值，露在外面的仍是我们自己的按钮（样式才可控）。
     选了之后不重渲染，只改按钮上的字 —— 重渲染会让输入框里没提交的文字丢掉 */
  dueBtn.onclick = () => {
    dueIn.value = tdDue;
    try { dueIn.showPicker(); } catch (e) { dueIn.focus(); dueIn.click(); }
  };
  dueIn.onchange = () => {
    if (!dueIn.value) return;
    tdDue = dueIn.value;
    dueBtn.querySelector('span').textContent = dueLabel(tdDue);
    dueBtn.classList.toggle('today', tdDue === today);
    input.focus();
  };

  body.querySelectorAll('[data-view]').forEach(b => {
    b.onclick = () => { closePrioPop(); tdView = b.dataset.view; renderTodo(); };
  });
  body.querySelectorAll('.td-item').forEach(row => {
    const id = row.dataset.tid;
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    row.querySelector('[data-act="toggle"]').onclick = e => {
      e.stopPropagation();
      task.done = !task.done;
      renderTodo();
      saveWidgetNow();
    };
    row.querySelector('[data-act="prio"]').onclick = e => {
      e.stopPropagation();
      const btn = e.currentTarget;
      openPrioPop(btn, Number(task.prio) || 0, p => {
        task.prio = p;
        renderTodo();
        saveWidgetNow();
      });
    };
    row.querySelector('[data-act="del"]').onclick = e => {
      e.stopPropagation();
      closePrioPop();
      wpData.tasks = tasks.filter(t => t.id !== id);
      renderTodo();
      saveWidgetNow();
    };
  });
}

/* ---------- 时钟 ---------- */
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
function tick() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  $('#time').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  $('#date').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${WEEK[d.getDay()]}`;
}

/* 顶部居中的模式提示：图标+文字，显示 1.6s 后自动收起。
   连点时清掉上一个定时器，只显示最新状态，不会排队叠加 */
let toastTimer = null;
function showToastBox(iconKey, text) {
  const t = $('#toast');
  $('#toastIco').innerHTML = svgOf(ICON[iconKey]);
  $('#toastText').textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}
function showToast(isLan) { showToastBox(isLan ? 'lan' : 'wan', isLan ? '内网模式' : '公网模式'); }

/* ---------- 壁纸轮播开关（只在后台开了轮播且壁纸 ≥2 张时出现） ----------
   暂停/继续只影响本机：状态写 localStorage，刷新后按它决定要不要重新转起来 */
function paintBgBtn() {
  const b = $('#bgBtn');
  const on = !bgPaused && !!bgPlan;
  b.innerHTML = svgOf(ICON[on ? 'play' : 'pause']);
  b.dataset.tip = on ? '壁纸轮播中，点击暂停' : '壁纸轮播已暂停，点击继续';
  b.setAttribute('aria-label', on ? '暂停壁纸轮播' : '继续壁纸轮播');
  b.setAttribute('aria-pressed', String(on));
}
$('#bgBtn').onclick = () => {
  const b = $('#bgBtn');
  if (!bgPlan) return;              // 没有轮播安排（没开开关 / 只有一张），点了也没事可做
  bgPaused = !bgPaused;
  try { localStorage.setItem(BGPLAY_KEY, bgPaused ? '0' : '1'); } catch (e) {}
  syncBgTimer();
  paintBgBtn();
  /* 鼠标点击会先 pointerdown 把气泡收掉；这里兜住键盘激活 / 程序化触发的点击，
     免得气泡还挂着「点击暂停」这种过期文案 */
  if (tipHost === b) tipShow(b);
  showToastBox(bgPaused ? 'pause' : 'play', bgPaused ? '壁纸轮播已暂停' : '壁纸轮播已继续');

/* ---------- 管理后台弹窗（同文档组件，不再是 iframe） ---------- */
/*
 * 后台 bundle 是构建产物、文件名带哈希，纯静态页没法写死路径。
 * 这里先读 /admin 这份 HTML，把它引用的 stylesheet / module 原样搬过来，
 * 再 import 那个模块 —— 模块加载后会自己挂到 #adminRoot 上（见 admin-vue/src/mount.ts）。
 * 只在第一次打开时做一次，之后复用同一个 Vue 实例（切标签页的状态都还在）。
 */
let adminBoot = null;
let adminMod = null;      // 后台 bundle 的模块命名空间（mountAdmin / openItemEditor 都在里面）
let adminSrc = '';        // 当前已加载的后台入口脚本（带哈希，用来判断有没有出新版）
function loadAdmin() {
  if (adminBoot) return adminBoot;
  adminBoot = (async () => {
    const html = await (await fetch('/admin', { cache: 'no-store' })).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');

    /* 收集本次新插的样式表，等它们真正加载完再挂载，
       否则会先闪一下没有 Element Plus 样式的裸表单 */
    const waits = [];
    for (const l of doc.querySelectorAll('link[rel="stylesheet"]')) {
      const href = l.getAttribute('href');
      if (!href || document.querySelector(`link[data-udenav-admin][href="${href}"]`)) continue;
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = href;
      link.setAttribute('data-udenav-admin', '');
      document.head.appendChild(link);
      waits.push(new Promise(res => { link.onload = res; link.onerror = res; }));
    }
    if (waits.length) await Promise.all(waits);

    const src = doc.querySelector('script[type="module"]')?.getAttribute('src');
    if (!src) throw new Error('未找到后台入口脚本');
    adminSrc = src;
    /* 先置位：模块据此跳过「独立页」那套初始化（压深色、删 boot 骨架、自动挂后台面板）。
       内嵌场景由本页决定挂什么：要后台就 mountAdmin，只改一张卡就用 openItemEditor */
    window.__udenavEmbedded = true;
    adminMod = await import(new URL(src, location.origin).href);
  })();
  return adminBoot;
}

/* 部署新版后，这个标签页里跑的还是旧 bundle（模块只 import 一次、卸载不掉）。
   每次开弹窗前比一下 /admin 引用的脚本名，变了就整页刷新，避免「功能像是没生效」。 */
async function adminBuildChanged() {
  if (!adminSrc) return false;
  try {
    const html = await (await fetch('/admin', { cache: 'no-store' })).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const src = doc.querySelector('script[type="module"]')?.getAttribute('src');
    return !!src && src !== adminSrc;
  } catch { return false; }
}
