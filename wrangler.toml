# ============================================================
# Cloudflare Workers 配置（GitHub 自动部署模式）
#
# 注意：
# - account_id / database_id 不需要写在文件里 ——
#   在 Cloudflare 控制台创建 Worker 时自动关联，GitHub 推送自动识别。
# - SECRET 等密钥不能放这里 —— 去 Cloudflare 控制台
#   Workers & Pages → 你的 Worker → Settings → Variables & Secrets 设置。
# ============================================================

name = "udenav"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 免费子域名 xxx.your-sub.workers.dev
workers_dev = true

# 静态文件（public/ 目录）通过 ASSETS 绑定在 fetch() 里回退返回
assets = { directory = "./public", binding = "ASSETS" }

# ---------- D1 数据库 ----------
# 在 Cloudflare 控制台创建，名字填 udenav-database
[[d1_databases]]
binding = "DB"
database_name = "udenav-database"

# ---------- 环境变量（非敏感，密钥放 Cloudflare 控制台）----------
[vars]
# 首启时是否写入示例分组/卡片数据：1=写，0=不写
SEED_DEMO = "1"

# 若启用了 Cloudflare Access，填入 Access 应用的 AUD
ACCESS_AUD = "udenav"

# Cloudflare Access 团队域名（如 yourteam.cloudflareaccess.com），用于拉取验签公钥。
# 配了它，后端才会真正校验 Access JWT 的 RS256 签名；不配则只校验 aud/exp（边缘已鉴权）。
# ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"

# ---------- AI 绑定（Cloudflare Workers AI）----------
# 走账号自带的 AI 额度：后台「AI 模型管理」选「Cloudflare Workers AI」即可用，不用密钥。
# 关键好处是**不产生公网请求** —— 很多第三方中转站在 Cloudflare 出口上有限流（error 1015），
# 走绑定就绕开了这条路。免费额度按 neurons 计，卡片补全这种短请求完全够用。
[ai]
binding = "AI"

# ---------- 定时任务 ----------
# 每小时整点触发一次。真正的执行策略（每小时/每天/每周）由后台配置决定：
# cron 表达式是部署配置，运行时改不了，所以这里固定每小时，代码里按策略判断是否执行
[triggers]
crons = ["0 * * * *"]
